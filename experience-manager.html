// ─── tiny reactive framework ──────────────────────────────────────────────────
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') {
        Object.assign(el.style, v);
      } else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'ref') {
        if (typeof v === 'function') v(el);
      } else if (k === 'contenteditable') {
        el.setAttribute('contenteditable', v);
      } else if (k === 'placeholder') {
        el.placeholder = v;
      } else if (k === 'value' && (tag === 'INPUT' || tag === 'input' || tag === 'TEXTAREA' || tag === 'textarea')) {
        el.value = v ?? '';
      } else if (k === 'class') {
        el.className = v;
      } else if (k === 'type') {
        el.type = v;
      } else if (v !== false && v !== null && v !== undefined) {
        el.setAttribute(k, v);
      }
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return el;
}

// ─── hash routing ───────────────────────────────────────────────────────────
// The editor hash carries the component id so a shared link reopens the same
// component, not whichever one the app happened to boot with.
function hashForState() {
  if (state.view === 'editor') return `#/component/${state.componentId}/variant/${state.selectedVariantId}/${state.tab}`;
  if (state.view === 'experiments') return '#/experiments';
  return `#/list/${state.section}`;
}
function syncHash(push) {
  const target = hashForState();
  if (location.hash === target) return;
  if (push) history.pushState(null, '', target);
  else history.replaceState(null, '', target);
}
function editorStateFor(comp, variantId, rawTab) {
  const tab = ['content','page','targeting'].includes(rawTab) ? rawTab : 'content';
  return {
    view:'editor', section:comp.section, componentId:comp.id, componentTitle:displayTitle(comp.name),
    activePages:comp.pages, selectedVariantId:variantId, tab,
    // conditions are keyed by page name, so they can't carry across components
    ...(state.componentId === comp.id ? {} : { pageConditions:{} }),
  };
}
function parseHash() {
  const hash = location.hash;
  const hasVariant = id => state.variants.some(v => v.id === id);

  let m = hash.match(/^#\/component\/(\d+)\/variant\/(\d+)\/(\w+)$/);
  if (m) {
    const comp = findComponent(parseInt(m[1], 10));
    const variantId = parseInt(m[2], 10);
    if (comp && hasVariant(variantId)) return editorStateFor(comp, variantId, m[3]);
  }
  // legacy links that predate the component segment: resolve to the first component
  m = hash.match(/^#\/variant\/(\d+)\/(\w+)$/);
  if (m) {
    const comp = findComponent(compsData[0][0]);
    const variantId = parseInt(m[1], 10);
    if (comp && hasVariant(variantId)) return editorStateFor(comp, variantId, m[2]);
  }
  if (hash === '#/experiments') return { view:'experiments' };
  m = hash.match(/^#\/list\/(\w+)$/);
  if (m && LIST_SECTIONS[m[1]]) return { view:'list', section:m[1] };
  return { view:'list' };
}

}

}

}
function execCmd(cmd, val) { try { document.execCommand(cmd, false, val||null); } catch(e) {} }

// ─── shared form components ───────────────────────────────────────────────────
function fLabel(txt) {

function centerRow(txt, valueNode) {

function fInput(val, onInput, opts={}) {

function fTextarea(val, onInput, opts={}) {
  const ta = h('textarea', { onInput, placeholder:opts.placeholder||'', style:{ width:'100%', minHeight:'90px', border:'1px solid rgba(0,0,0,0.23)', borderRadius:'6px', padding:'12px 14px', fontSize:'15px', lineHeight:'1.5', ...opts.style }});
  ta.value = val;
  return ta;
}
function fSelect(val, options, onInput, style) {
  const sel = h('select', { onInput, style: style||{} });
  options.forEach(o => {
    const opt = h('option', { value:o }, o);
    if (o === val) opt.selected = true;
    sel.appendChild(opt);
  });
  return sel;
}
function hexColorPicker(label, color, onColorChange, onHexInput) {
  const wrap = h('div', { class:'hex-wrap' },

    h('input', { type:'color', value:color,

    h('input', { class:'hex-input', value:color,
      onInput: e => onHexInput(e.target.value) })

  return wrap;
}
function toggle(on, onClick) {

    h('div', { class:'tb', style:{ width:'32px', height:'32px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'default', color:'rgba(0,0,0,0.4)' }}, icon('arrow_drop_down',{fontSize:'18px'})),
    sep(),

    sep(),
    h('div', { class:'tb', onClick:()=>{ const u=window.prompt('Link URL'); if(u) execCmd('createLink',u); }, style:{ width:'32px', height:'32px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer' }}, icon('link',{fontSize:'20px'})),
  );
}

// ─── accordion component ──────────────────────────────────────────────────────
function accordion(items, renderBody, onToggle, onRemove) {
  return h('div', { class:'accordion' },
    ...items.map((item, i) =>
      h('div', { class:'accordion-item' },
        h('div', { class:'accordion-header', onClick:()=>onToggle(i) },
          icon(item.open ? 'expand_less' : 'expand_more', { fontSize:'20px', color:'rgba(0,0,0,0.54)' }),
          'Slide ' + (i+1),
          items.length > 1 ? h('div', { class:'tb', onClick:(e)=>{ e.stopPropagation(); onRemove(i); }, style:{ marginLeft:'auto', width:'30px', height:'30px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'50%', cursor:'pointer', color:'rgba(0,0,0,0.45)' }}, icon('close',{fontSize:'18px'})) : null
        ),
        item.open ? h('div', { class:'accordion-body' }, ...renderBody(item, i)) : null
      )
    )
  );
}

// component id → which list it lives in, its name and supported pages

  ['archived', 'Archived', 15],

function filterExperiments(tab) {
  if (tab === 'running')  return experimentsData.filter(e => e.status === 'Running');
  if (tab === 'editing')  return experimentsData.filter(e => e.status === 'Editing');
  if (tab === 'stopped')  return experimentsData.filter(e => e.status.startsWith('Stopped'));
  if (tab === 'archived') return [];
  return experimentsData;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');
  const scrollPositions = Array.from(root.querySelectorAll('.scroll')).map(el => el.scrollTop);
  root.innerHTML = '';
  root.appendChild(buildApp(state));
  Array.from(root.querySelectorAll('.scroll')).forEach((el, i) => {
    if (scrollPositions[i] != null) el.scrollTop = scrollPositions[i];
  });
}

function buildApp(s) {
  return h('div', { style:{ display:'flex', height:'100vh', overflow:'hidden' }},
    buildSecondary(s),

  );
}

const ATTRIBUTE_OPTIONS = ['By Audience','Category Relation','Category Relation (Backoffice Name)','Collection','Discount Percentage','Expedited Production days','Grouped parent SKU','Material','Parent SKUs','Price','Product Type','Production days','ShippingByFactory','Shop For','SKU','Stock Status','Stone'];
const OPERATOR_OPTIONS = ['IsOneOf','IsNoneOf'];

function renderAddConditionsBtn(onClick) {
  return h('div', { onClick, style:{ display:'inline-flex', alignItems:'center', gap:'6px', color:'#1976d2', fontSize:'14px', fontWeight:'600', letterSpacing:'.3px', cursor:'pointer' }},
    icon('add',{fontSize:'20px'}), 'ADD CONDITIONS'
  );
}
function renderConditionRow(cond, attributeOptions, onAttr, onOperator, onValue, onRemove) {
  return h('div', { style:{ display:'flex', gap:'12px', alignItems:'center', marginBottom:'14px' }},
    fSelect(cond.attribute, attributeOptions, onAttr, {minWidth:'220px'}),
    fSelect(cond.operator, OPERATOR_OPTIONS, onOperator, {minWidth:'150px'}),
    fInput(cond.value, onValue, { placeholder:`Select ${cond.attribute}`, style:{ flex:'1' }}),
    h('div', { class:'tb', onClick:onRemove, style:{ width:'36px', height:'36px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'rgba(0,0,0,0.45)', flexShrink:'0' }}, icon('close',{fontSize:'20px'}))
  );
}

function addCondition(pageName) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: [...(prev.pageConditions[pageName]||[]), { attribute:'Parent SKUs', operator:'IsOneOf', value:'' }] } }));
}
function updateCondition(pageName, i, patch) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: prev.pageConditions[pageName].map((c,j)=> j===i ? {...c, ...patch} : c) } }));
}
function removeCondition(pageName, i) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: prev.pageConditions[pageName].filter((_,j)=>j!==i) } }));
}
function buildPageSection(s, pageName) {
  const conditions = s.pageConditions[pageName] || [];
  return h('div', { style:{ marginBottom:'40px' }},
    h('div', { style:{ fontSize:'18px', fontWeight:'700', marginBottom:'14px' }}, pageName + ':'),
    conditions.length === 0
      ? h('div', {},
          h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }}, `No filters selected. The variant will appear for all ${pageName}s.`),
          renderAddConditionsBtn(()=>addCondition(pageName))
        )
      : h('div', {},
          ...conditions.map((cond,i) => renderConditionRow(cond, ATTRIBUTE_OPTIONS,
            e=>updateCondition(pageName,i,{attribute:e.target.value}),
            e=>updateCondition(pageName,i,{operator:e.target.value}),
            e=>updateCondition(pageName,i,{value:e.target.value}),
            ()=>removeCondition(pageName,i)
          )),
          renderAddConditionsBtn(()=>addCondition(pageName))
        )
  );
}
function buildPageTab(s) {
  return h('div', { style:{ maxWidth:'1200px' }},
    ...s.activePages.map(pageName => buildPageSection(s, pageName))
  );
}

}
function removeTargetingCondition(group, i) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: prev.targetingConditions[group].filter((_,j)=>j!==i) } }));
}

function buildTargetingSection(s, section) {
  const { group, icon:ico, title, noun, attributeOptions } = section;
  const open = s.targetingOpen[group];
  const conditions = s.targetingConditions[group];
  return h('div', {},
    h('div', { onClick:()=>toggleTargetingSection(group), style:{ display:'flex', alignItems:'center', gap:'10px', cursor:'pointer', marginBottom: open?'14px':'0' }},
      icon(open?'expand_more':'chevron_right', {fontSize:'20px', color:'rgba(0,0,0,0.6)'}),
      icon(ico, {fontSize:'20px', color:'rgba(0,0,0,0.6)'}),
      h('div', { style:{ fontSize:'17px', fontWeight:'700' }}, title + ':')
    ),
    open ? (
      conditions.length === 0
        ? h('div', {},
            h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }}, `No ${noun} filters selected. The variant will be shown to all ${noun}s.`),
            renderAddConditionsBtn(()=>addTargetingCondition(group, attributeOptions[0]))
          )
        : h('div', {},
            ...conditions.map((cond,i) => renderConditionRow(cond, attributeOptions,
              e=>updateTargetingCondition(group,i,{attribute:e.target.value}),
              e=>updateTargetingCondition(group,i,{operator:e.target.value}),
              e=>updateTargetingCondition(group,i,{value:e.target.value}),
              ()=>removeTargetingCondition(group,i)
            )),
            renderAddConditionsBtn(()=>addTargetingCondition(group, attributeOptions[0]))
          )
    ) : null
  );
}

function buildTargetingTab(s) {
  return h('div', { style:{ maxWidth:'1200px' }},
    ...TARGETING_SECTIONS.map((section, idx) =>
      h('div', {},
        buildTargetingSection(s, section),
        idx < TARGETING_SECTIONS.length - 1 ? h('div', { style:{ height:'1px', background:'rgba(0,0,0,0.1)', margin:'24px 0 28px' }}) : null
      )
    )
  );
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
Object.assign(state, parseHash());
syncHash(false);
window.addEventListener('hashchange', () => setState(parseHash()));
render();
</script>
</body>
</html>
