<div id="app" style="display:flex;flex-direction:column;height:100vh;overflow:hidden"></div>

<script>
// ─── tiny reactive framework ──────────────────────────────────────────────────
let _currentApp = null;
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') {
        Object.assign(el.style, v);
      } else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'ref') {
        if (typeof v === 'function') v(el);
      } else if (k === 'contenteditable') {
        el.setAttribute('contenteditable', v);
      } else if (k === 'placeholder') {
        el.placeholder = v;
      } else if (k === 'value' && (tag === 'INPUT' || tag === 'input')) {
        el.value = v ?? '';
      } else if (k === 'class') {
        el.className = v;
      } else if (v !== false && v !== null && v !== undefined) {
        el.setAttribute(k, v);
      }
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return el;
}

// ─── state ────────────────────────────────────────────────────────────────────
const state = {

  pm_borderColor: '',

};

let _saveTimer = null;
let _richHTML = '<div style="font-size:20px;font-weight:700;margin-bottom:8px">Welcome to the Rich Text Editor!</div><div style="color:rgba(0,0,0,0.65)">Lorem ipsum dolor sit amet consectetur adipiscing elit. Ut et massa mi. Aliquam in hendrerit urna. Pellentesque sit amet sapien.</div>';

function setState(patch) {
  if (typeof patch === 'function') patch = patch(state);
  Object.assign(state, patch);
  render();
}

// ─── helpers ──────────────────────────────────────────────────────────────────
function icon(name, style) {
  return h('span', { class: 'ms', style: style || {} }, name);
}

function railStyle(active) {
  return { display:'flex', flexDirection:'column', alignItems:'center', gap:'4px', padding:'12px 4px', cursor:'pointer', borderRadius:'8px', margin:'0 10px', color: active ? '#4aa3ff' : 'rgba(255,255,255,0.75)', transition:'background 150ms' };
}

function tabStyle(active) {
  return `display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 0;cursor:pointer;font-size:15px;font-weight:500;letter-spacing:.6px;color:${active ? '#1976d2' : 'rgba(0,0,0,0.6)'};border-bottom:3px solid ${active ? '#1976d2' : 'transparent'};transition:color 150ms`;
}

function ringStyle(active, disabled) {
  const bc = disabled ? 'rgba(0,0,0,0.22)' : (active ? '#1976d2' : 'rgba(0,0,0,0.45)');
  return { width:'22px', height:'22px', borderRadius:'50%', border:`2px solid ${bc}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:'0' };
}

function boxStyle(checked) {
  return { width:'22px', height:'22px', borderRadius:'4px', flexShrink:'0', display:'flex', alignItems:'center', justifyContent:'center', background: checked ? '#1976d2' : '#fff', border: `2px solid ${checked ? '#1976d2' : 'rgba(0,0,0,0.4)'}` };
}

function chipStyle(checked) {
  return { display:'inline-flex', alignItems:'center', gap:'6px', padding:'9px 16px', borderRadius:'9999px', fontSize:'15px', cursor:'pointer', border:`1px solid ${checked ? '#1976d2' : 'rgba(0,0,0,0.23)'}`, background: checked ? 'rgba(25,118,210,0.1)' : '#fff', color: checked ? '#1565c0' : 'rgba(0,0,0,0.75)', fontWeight: checked ? 500 : 400 };
}

function switchTrack(on) {
  return { width:'44px', height:'24px', borderRadius:'9999px', background: on ? '#4aa3ff' : 'rgba(0,0,0,0.26)', position:'relative', cursor:'pointer', transition:'background 200ms', padding:'2px', display:'flex', alignItems:'center' };
}

function switchThumb(on) {
  return { display:'block', width:'20px', height:'20px', borderRadius:'50%', background:'#fff', boxShadow:'0 1px 3px rgba(0,0,0,0.3)', transform:`translateX(${on ? '20px' : '0'})`, transition:'transform 200ms', flexShrink:'0' };
}

function execCmd(cmd, val) {
  try { document.execCommand(cmd, false, val || null); } catch(e) {}
}

// ─── STATUS COLORS ────────────────────────────────────────────────────────────
const statusColors = {
  Live:      { bg: 'rgba(46,125,50,0.14)',    fg: '#2e7d32', dot: '#2e7d32' },
  Draft:     { bg: 'rgba(0,0,0,0.08)',         fg: 'rgba(0,0,0,0.7)', dot: 'rgba(0,0,0,0.5)' },
  Scheduled: { bg: 'rgba(2,136,209,0.14)',     fg: '#0277bd', dot: '#0288d1' },
  Archived:  { bg: 'rgba(0,0,0,0.08)',         fg: 'rgba(0,0,0,0.55)', dot: 'rgba(0,0,0,0.4)' },
};

// ─── RICH TEXT TOOLBAR ────────────────────────────────────────────────────────
function richToolbar() {
  const btn = (ico, cmd, val) => h('div', { class:'tb', onClick: () => execCmd(cmd, val), style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer' } }, icon(ico, { fontSize:'22px' }));
  const sep = () => h('div', { style:{ width:'1px', height:'24px', background:'rgba(0,0,0,0.12)', margin:'0 6px' }});
  return h('div', { style:{ display:'flex', alignItems:'center', gap:'2px', padding:'8px 10px', borderBottom:'1px solid rgba(0,0,0,0.12)' }},
    h('div', { style:{ display:'flex', alignItems:'center', gap:'6px', padding:'6px 10px', border:'1px solid rgba(0,0,0,0.15)', borderRadius:'5px', fontSize:'14px', marginRight:'10px', cursor:'default' }}, 'Default Regular', icon('arrow_drop_down', { fontSize:'20px' })),
    h('div', { class:'tb', onClick: () => execCmd('foreColor','#1976d2'), style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer' }}, h('span', { style:{ width:'16px', height:'16px', borderRadius:'50%', background:'#334155', display:'block' }})),
    sep(),
    btn('format_bold','bold'), btn('format_italic','italic'), btn('format_underlined','underline'),
    sep(),
    btn('format_align_left','justifyLeft'), btn('format_align_center','justifyCenter'), btn('format_align_right','justifyRight'),
    sep(),
    btn('format_list_bulleted','insertUnorderedList'),
    h('div', { class:'tb', onClick: () => { const u = window.prompt('Link URL'); if(u) execCmd('createLink', u); }, style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer', marginLeft:'auto' }}, icon('link')),
  );
}

function richEditor(id) {
  return h('div', { contenteditable:'true',
    ref: (el) => { if(el && !el.dataset.bound) { el.dataset.bound='1'; el.innerHTML = _richHTML; }},
    onInput: (e) => { _richHTML = e.currentTarget.innerHTML; },
    style:{ minHeight:'170px', background:'#fff', padding:'18px 20px', fontSize:'16px', lineHeight:'1.5' }
  });
}

// ─── COMPONENTS DATA ──────────────────────────────────────────────────────────
const compsData = [
  [1,  'PDP Line',               ['Product page'],                                                           0, 69],
  [2,  'Header carousel',        ['Category page','Cart page','Home page'],                                  1, 13],
  [3,  'A2C Messaging',          ['Product page'],                                                           0, 17],
  [4,  'Category Images',        ['Category page'],                                                          0, 21],
  [6,  'Topline',                ['Contact informatio…','Product page','Category page'],                     9, 12],
  [7,  'UGC carousel',           ['Product page'],                                                           0, 21],
  [8,  'USP Messages',           ['Cart page','Product page'],                                               0, 17],
  [11, 'Primary Carousel - PDP', ['Product page'],                                                           0, 50],
  [14, 'Secondary Carousel - PDP',['Product page'],                                                          0,  1],
];

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const s = state;
  const root = document.getElementById('app');
  root.innerHTML = '';
  root.appendChild(buildApp(s));
}

function buildApp(s) {
  return h('div', { style:{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden' }},
    buildTopBar(),
    h('div', { style:{ flex:'1', display:'flex', minHeight:'0' }},
      buildRail(s),
      buildSecondary(s),
      h('div', { class:'scroll', style:{ flex:'1', minWidth:'0', overflowY:'auto', padding:'24px' }},
        s.view === 'list' ? buildListView(s) : buildEditorView(s)
      )
    )
  );
}

// ─── TOP BAR ─────────────────────────────────────────────────────────────────
function buildTopBar() {
  return h('div', { style:{ height:'64px', flexShrink:'0', background:'#1a1a1a', color:'#fff', display:'flex', alignItems:'center', padding:'0 20px 0 0', gap:'0' }},
    h('div', { style:{ width:'96px', flexShrink:'0', display:'flex', alignItems:'center', justifyContent:'center', height:'64px' }},
      h('div', { style:{ width:'44px', height:'44px', border:'1.5px solid #fff', borderRadius:'8px', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:'700', fontSize:'18px', letterSpacing:'-1px' }}, 'TG')
    ),
    h('div', { style:{ fontWeight:'700', fontSize:'20px', letterSpacing:'8px' }}, 'TENENGROUP'),
    h('div', { style:{ display:'flex', alignItems:'center', gap:'12px', marginLeft:'40px' }},
      h('span', { style:{ fontWeight:'500', fontSize:'19px', letterSpacing:'.3px' }}, 'Experience Manager'),
      h('span', { style:{ display:'inline-flex', alignItems:'center', gap:'5px', background:'#e53232', color:'#fff', fontSize:'12px', fontWeight:'600', padding:'3px 9px', borderRadius:'6px' }}, icon('rocket_launch', { fontSize:'15px' }), 'Prod'),
    ),
    h('div', { style:{ marginLeft:'auto', display:'flex', alignItems:'center', gap:'18px' }},
      h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'10px', width:'280px', height:'40px', padding:'0 10px 0 16px', border:'1px solid rgba(255,255,255,0.35)', borderRadius:'5px', fontSize:'15px', cursor:'pointer' }},
        'TGR US',
        icon('arrow_drop_down', { fontSize:'22px', color:'rgba(255,255,255,0.7)' })
      ),
      h('div', { style:{ width:'38px', height:'38px', borderRadius:'50%', background:'#5a5a5a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'13px', fontWeight:'500', cursor:'pointer' }}, 'TB'),
    )
  );
}

// ─── RAIL ─────────────────────────────────────────────────────────────────────
function buildRail(s) {
  const items = [
    ['home','Home'], ['receipt_long','Orders'], ['grid_view','Category'],
    ['shopping_cart','Carts'], ['local_shipping','Shipment'], ['account_circle','Accounts'],
    ['storefront','Catalog'], ['laptop_mac','Experiences'], ['payments','Payments'],
  ];
  return h('div', { style:{ width:'96px', flexShrink:'0', background:'#1a1a1a', color:'#fff', display:'flex', flexDirection:'column', padding:'16px 0', gap:'2px', overflowY:'auto' }},
    ...items.map(([ico, label]) => {
      const active = label === 'Experiences';
      return h('div', { class:'navitem', onClick: active ? () => setState({ view:'list' }) : undefined, style: railStyle(active) },
        icon(ico, { fontSize:'24px' }),
        h('span', { style:{ fontSize:'11px' }}, label)
      );
    })
  );
}

// ─── SECONDARY PANEL ─────────────────────────────────────────────────────────
function buildSecondary(s) {
  const collapsed = s.secondaryCollapsed;
  const items = [['grid_view','Content'],['view_carousel','Banners'],['sell','Promotions'],['science','Experiments']];
  return h('div', { onClick: () => setState(p => ({ secondaryCollapsed: !p.secondaryCollapsed })),
    style:{ width: collapsed ? '68px' : '236px', flexShrink:'0', background:'#fff', borderRight:'1px solid rgba(0,0,0,0.12)', display:'flex', flexDirection:'column', padding:`22px ${collapsed ? 10 : 14}px`, transition:'width 200ms', cursor:'pointer' }},
    ...items.map(([ico, label]) => {
      const active = label === 'Content';
      return h('div', { class:'panelitem', onClick: active ? (e) => { e.stopPropagation(); setState({ view:'list' }); } : undefined,
        style:{ display:'flex', alignItems:'center', gap: collapsed ? '0' : '14px', justifyContent: collapsed ? 'center' : 'flex-start', padding:`11px ${collapsed ? 0 : 12}px`, borderRadius:'8px', cursor:'pointer', marginBottom:'2px', background: active ? 'rgba(25,118,210,0.1)' : 'transparent' }},
        icon(ico, { fontSize:'22px', color: active ? '#1976d2' : 'rgba(0,0,0,0.55)' }),
        !collapsed ? h('span', { style:{ fontSize:'15px', fontWeight: active ? 500 : 400, color: active ? '#1976d2' : 'rgba(0,0,0,0.75)' }}, label) : null
      );
    }),
    h('div', { class:'panelitem', style:{ marginTop:'auto', display:'flex', justifyContent: collapsed ? 'center' : 'flex-start', padding:'8px', cursor:'pointer', borderRadius:'8px' }},
      h('span', { style:{ display:'inline-flex', alignItems:'center', justifyContent:'center', border:'1px solid rgba(0,0,0,0.12)', borderRadius:'50%', padding:'2px' }},
        icon(collapsed ? 'chevron_right' : 'chevron_left', { fontSize:'22px', color:'rgba(0,0,0,0.4)' })
      )
    )
  );
}

// ─── LIST VIEW ────────────────────────────────────────────────────────────────
function buildListView(s) {
  return h('div', { style:{ background:'#fff', borderRadius:'8px', boxShadow:'0px 2px 1px -1px rgba(0,0,0,0.06),0px 1px 3px 0px rgba(0,0,0,0.10)', minHeight:'calc(100vh - 112px)' }},
    // header
    h('div', { style:{ display:'flex', alignItems:'center', gap:'24px', padding:'26px 32px 20px' }},
      h('h1', { style:{ margin:'0', fontSize:'30px', fontWeight:'400', flexShrink:'0' }}, 'Content Components'),
      h('div', { style:{ marginLeft:'auto', display:'flex', alignItems:'center', gap:'18px' }},
        h('div', { style:{ display:'flex', alignItems:'center', gap:'10px', width:'420px', height:'44px', padding:'0 14px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', color:'rgba(0,0,0,0.4)', cursor:'text' }},
          icon('search', { fontSize:'22px' }),
          h('span', { style:{ fontSize:'15px' }}, 'Search by name, id, or supported page')
        ),
        h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', height:'44px', padding:'0 14px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', fontSize:'15px', color:'rgba(0,0,0,0.6)', cursor:'pointer' }},
          'Supported pages: ', h('span', { style:{ color:'rgba(0,0,0,0.87)' }}, 'All pages'), icon('arrow_drop_down', { fontSize:'22px' })
        ),
      )
    ),
    // table header
    h('div', { style:{ display:'grid', gridTemplateColumns:'90px 1fr 1fr 220px 150px', gap:'16px', padding:'12px 32px', borderBottom:'1px solid rgba(0,0,0,0.12)', fontSize:'15px', fontWeight:'500' }},
      h('div', { style:{ display:'flex', alignItems:'center', gap:'4px' }}, 'ID', icon('arrow_upward', { fontSize:'18px', color:'rgba(0,0,0,0.6)' })),
      h('div', {}, 'Component Name'),
      h('div', {}, 'Supported Pages'),
      h('div', {}, 'Last Modified'),
      h('div', {}, 'Active Variants'),
    ),
    // rows
    ...compsData.map(([id, name, pages, more, variants]) =>
      h('div', { class:'row fade', onClick: () => {
          setState({ view:'editor', componentTitle: name === 'PDP Line' ? 'PDPLine' : name, tab:'content', secondaryCollapsed:true, selectedVariantId:1, variantTab:'active', variantSearch:'' });
        }, style:{ display:'grid', gridTemplateColumns:'90px 1fr 1fr 220px 150px', gap:'16px', padding:'20px 32px', borderBottom:'1px solid rgba(0,0,0,0.12)', fontSize:'15px', cursor:'pointer', alignItems:'center' }},
        h('div', { style:{ color:'rgba(0,0,0,0.6)' }}, id),
        h('div', {}, name),
        h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px' }},
          ...pages.map(p => h('span', { style:{ background:'rgba(0,0,0,0.07)', borderRadius:'9999px', padding:'5px 12px', fontSize:'13px', color:'rgba(0,0,0,0.75)', whiteSpace:'nowrap' }}, p)),
          more > 0 ? h('span', { style:{ background:'rgba(0,0,0,0.07)', borderRadius:'9999px', padding:'5px 12px', fontSize:'13px', color:'rgba(0,0,0,0.75)' }}, '+' + more) : null
        ),
        h('div', { style:{ color:'rgba(0,0,0,0.7)' }}, '02/06/2026 10:59'),
        h('div', {}, variants),
      )
    ),
    // pagination
    h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:'26px', padding:'16px 32px', fontSize:'14px', color:'rgba(0,0,0,0.6)' }},
      h('div', { style:{ display:'flex', alignItems:'center', gap:'6px' }}, 'Rows per page:', h('span', { style:{ color:'rgba(0,0,0,0.87)' }}, '15'), icon('arrow_drop_down', { fontSize:'20px' })),
      h('div', {}, '1–9 of 9'),
      h('div', { style:{ display:'flex', gap:'8px' }}, icon('chevron_left', { style:{}, style2: null, fontSize:'22px', color:'rgba(0,0,0,0.26)' }), icon('chevron_right', { fontSize:'22px', color:'rgba(0,0,0,0.26)' })),
    )
  );
}

// ─── EDITOR VIEW ─────────────────────────────────────────────────────────────
function buildEditorView(s) {
  return h('div', { style:{ display:'flex', gap:'24px', alignItems:'flex-start' }},
    buildVariantPanel(s),
    buildFormCard(s),
  );
}

function buildVariantPanel(s) {
  const activeVs = s.variants.filter(v => v.status === 'active');
  const archivedVs = s.variants.filter(v => v.status === 'archived');
  const q = s.variantSearch.trim().toLowerCase();
  const shownVs = (s.variantTab === 'active' ? activeVs : archivedVs).filter(v => !q || (v.name||'new variant').toLowerCase().includes(q));

  function mkTabStyle(key) {
    const on = s.variantTab === key;
    return { style:`display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;font-size:14px;font-weight:500;cursor:pointer;background:${on ? '#1976d2' : 'transparent'};color:${on ? '#fff' : 'rgba(0,0,0,0.6)'}`,
             badge:`min-width:20px;height:20px;padding:0 6px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:${on ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.1)'};color:${on ? '#fff' : 'rgba(0,0,0,0.6)'}` };
  }
  const at = mkTabStyle('active'), art = mkTabStyle('archived');

  return h('div', { style:{ width:'360px', flexShrink:'0', background:'#fff', borderRadius:'8px', boxShadow:'0px 2px 1px -1px rgba(0,0,0,0.06),0px 1px 3px 0px rgba(0,0,0,0.10)', minHeight:'calc(100vh - 112px)', padding:'20px 20px 26px', display:'flex', flexDirection:'column' }},
    // back + add
    h('div', { style:{ display:'flex', alignItems:'center', marginBottom:'6px' }},
      h('div', { class:'tb', onClick: () => setState({ view:'list' }), style:{ width:'42px', height:'42px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'rgba(0,0,0,0.7)' }}, icon('arrow_back')),
      h('div', { onClick: () => setState(prev => {
          const id = Math.max(0, ...prev.variants.map(v => v.id)) + 1;
          return { variants:[...prev.variants, { id, name:'', status:'active' }], selectedVariantId:id, variantTab:'active' };
        }), style:{ marginLeft:'auto', display:'inline-flex', alignItems:'center', gap:'8px', padding:'11px 18px', borderRadius:'5px', background:'#1976d2', color:'#fff', fontSize:'14px', fontWeight:'500', letterSpacing:'.4px', cursor:'pointer', boxShadow:'0px 3px 1px -2px rgba(0,0,0,0.2),0px 1px 5px 0px rgba(0,0,0,0.12)' }},
        icon('add', { fontSize:'20px' }), 'ADD VARIANT'
      )
    ),

// ─── CONTENT TAB ─────────────────────────────────────────────────────────────
function buildContentTab(s) {
  const templates = [
    ['default','Text'], ['switch','Product Switch'], ['reviews','Reviews'], ['ai','AI Review Summary'], ['popup','Popup Media'],
  ];
  const disabled = k => k === 'switch' || k === 'reviews' || k === 'ai';

  return h('div', {},
    h('div', { style:{ display:'flex', alignItems:'center', gap:'36px', marginBottom:'8px' }},
      h('div', { style:{ fontSize:'18px', fontWeight:'600', width:'110px', flexShrink:'0' }}, 'Template:'),
      h('div', { style:{ display:'flex', gap:'34px', flexWrap:'wrap' }},
        ...templates.map(([key, label]) =>
          h('div', { onClick: disabled(key) ? undefined : () => setState({ template:key }),
            style:{ display:'flex', alignItems:'center', gap:'9px', fontSize:'17px', cursor: disabled(key) ? 'not-allowed' : 'pointer', color: disabled(key) ? 'rgba(0,0,0,0.35)' : 'inherit' }},
            h('span', { style: ringStyle(s.template===key, disabled(key)) },
              s.template===key && !disabled(key) ? h('span', { style:{ width:'11px', height:'11px', borderRadius:'50%', background:'#1976d2', display:'block' }}) : null
            ),
            label
          )
        )
      )
    ),
    s.template === 'default' ? buildDefaultTemplate(s) :
    s.template === 'switch'  ? buildSwitchTemplate(s) :
    s.template === 'reviews' ? buildReviewsTemplate(s) :
    s.template === 'ai'      ? buildAiTemplate(s) :
    s.template === 'popup'   ? buildPopupTemplate(s) : null
  );
}

function fieldGrid(...rows) {
  return h('div', { style:{ display:'grid', gridTemplateColumns:'150px 1fr', gap:'26px 24px', alignItems:'start', marginTop:'30px', maxWidth:'1180px' }},
    ...rows.flat()
  );
}
function label(txt) { return h('div', { style:{ fontSize:'17px', paddingTop:'10px' }}, txt); }
function textInput(val, onInput, extra) {
  return h('input', { value: val, onInput, style:{ width:'100%', height:'52px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', padding:'0 14px', fontSize:'15px', ...extra }});
}
function dropdown(val) {
  return h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', width:'100%', maxWidth:'520px', height:'52px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', padding:'0 14px', fontSize:'15px', cursor:'pointer' }},
    val, icon('arrow_drop_down', { fontSize:'22px', color:'rgba(0,0,0,0.5)' })
  );
}

    h('div', { style:{ display:'grid', gridTemplateColumns:'150px 1fr', gap:'22px 24px', alignItems:'center', maxWidth:'640px' }},
      h('div', { style:{ fontSize:'16px' }}, 'Brand:'),
      h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', height:'52px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', padding:'0 14px', fontSize:'15px', cursor:'pointer' }}, s.t_brand, icon('arrow_drop_down', { fontSize:'22px', color:'rgba(0,0,0,0.5)' })),
      h('div', { style:{ fontSize:'16px' }}, 'Category:'),
      h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', height:'52px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', padding:'0 14px', fontSize:'15px', cursor:'pointer' }}, s.t_category, icon('arrow_drop_down', { fontSize:'22px', color:'rgba(0,0,0,0.5)' })),
      h('div', { style:{ fontSize:'16px' }}, 'SKU list:'),
      h('input', { value:s.t_sku, onInput:e=>setState({t_sku:e.target.value}), placeholder:'Comma-separated SKUs', style:{ height:'52px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', padding:'0 14px', fontSize:'15px' }})
    )
  );
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
