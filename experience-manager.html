// reuses the hero banner's Visual, Link and Live Text layers.
const CATEGORY_IMAGES = 'Category Images';
const CI_MAX_CARDS = 6;
const CI_TEMPLATES = [['text','Text Overlay'], ['image','Text below image']];
const CI_ALIGN = ['Left', 'Center', 'Right'];

function ciNewCard() { return { ...heroNewSlide(), open:true, row:'', align:'Center', slots:'1' }; }
// a shoppable image carries the slide fields, so it can hold a live text layer too
function ciNewShop() { return { ...heroNewSlide(), shopOpen:true }; }
// a new variant: no shoppable image and one empty card
function ciBlank() { return { ci_template:'text', ci_shop:null, ci_cards:[ciNewCard()] }; }
// the demo variants open on a filled shoppable image and one two-slot card
function ciDefaults() {
  return {
    ci_template: 'text',
    ci_shop: { ...heroNewSlide(), desktopImage:true, mobileImage:true, shopOpen:true, pinStyle:hsSeedPinStyle(),
      products:[ hsSeedProduct('101-01-049-01', [70,52], [62,74]), hsSeedProduct('101-01-055-02', [28,76], [22,44]) ] },

}

function setCiCard(i, patch) { setState(p => ({ ci_cards: p.ci_cards.map((c,j)=> j===i ? { ...c, ...patch } : c) })); }
function setCiShop(patch)    { setState(p => ({ ci_shop: { ...p.ci_shop, ...patch } })); }

// Same card shell as a hero slide; Row, Alignment and Product slots place the
// card in the product grid, then come the layers.
function ciCard(s, card, i, removable) {
  const set = p => setCiCard(i, p);
  const name = 'Category image ' + (i+1);
  return h('div', { class:'hero-slide ci-card' + (card.open ? ' open' : '') },
    h('div', { class:'hero-slide-head', onClick:()=>set({ open: !card.open }) },
      heroBadge('#' + (i+1), null, 'idx'),
      h('div', { class:'hero-slide-name', style:{ flex:'1' }}, name),
      h('div', { class:'tb', title: card.open ? 'Collapse' : 'Expand',
        style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'6px', color:'rgba(0,0,0,0.54)' }},
        icon(card.open ? 'expand_less' : 'expand_more', { fontSize:'22px' })),
      removable ? h('div', { class:'tb', title:'Delete category image', onClick:e=>{ e.stopPropagation(); setState(p=>({ ci_cards:p.ci_cards.filter((_,j)=>j!==i) })); },
        style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'6px', cursor:'pointer', color:'rgba(0,0,0,0.45)' }},
        icon('close',{fontSize:'20px'})) : null
    ),
    !card.open ? null : h('div', { class:'hero-slide-body' },
      heroField('Row*', h('input', { class:'hero-input', type:'number', min:'1', value:card.row, placeholder:'e.g. 6', style:{ width:'110px', flex:'none' },
        onInput:e=>set({ row:e.target.value }) })),
      heroField('Alignment', heroSelect(card.align, CI_ALIGN, v=>set({ align:v }), { minWidth:'140px' })),
      heroField('Product slots', heroRadios(card.slots, [['1','1 slot'], ['2','2 slots']], v=>set({ slots:v }))),
      heroVisualLayer(s, card, set, false),
      heroLinkLayer(card, set),
      heroTextLayer(s, card, set, { buttons:false })
    )
  );
}

function buildCategoryImagesTemplate(s) {
  const n = s.ci_cards.length;
  return h('div', { class:'hero-tab' },
    heroCard('Template', null, heroRadios(s.ci_template, CI_TEMPLATES, v=>setState({ ci_template:v }))),
    // one optional shoppable image per variant; removing it can be undone by adding a fresh one
    s.ci_shop
      ? shoppableCard(s.ci_shop, { onPatch:setCiShop, onEdit:()=>hsOpen(0, 'ci'), onRemove:()=>setState({ ci_shop:null }),
          // live text sits inside the shoppable card, as it does on hero slides
          extra: heroTextLayer(s, s.ci_shop, setCiShop, { buttons:false }) })
      : h('div', {}, h('div', { class:'hero-btn hero-btn-outline', onClick:()=>setState({ ci_shop: ciNewShop() }) },
          icon('sell',{fontSize:'18px'}), 'Add Shoppable Image')),
    heroCard('Category Images', null,
      h('div', { class:'hero-slides' }, ...s.ci_cards.map((card,i)=>ciCard(s, card, i, n > 1))),
      h('div', { style:{ marginTop:'var(--mui-spacing-2)', display:'flex', alignItems:'center' }},
        h('div', { class:'hero-btn ' + (n >= CI_MAX_CARDS ? 'is-disabled' : 'hero-btn-outline'),
          onClick: n >= CI_MAX_CARDS ? undefined : ()=>setState(p=>({ ci_cards:[...p.ci_cards, ciNewCard()] })) },
          icon('add',{fontSize:'18px'}), 'Add Category Image'),
        h('div', { style:{ marginLeft:'auto', fontSize:'14px', color:'var(--mui-palette-text-secondary)' }}, `${n} of ${CI_MAX_CARDS} images`)
      )
    )
  );
}

// ── HIGHLIGHTS BAR ────────────────────────────────────────────────────────────
const HB_TYPOGRAPHY = ['Text 1','Text 2','Text 3','Text 4','Button'];

// A new variant opens with one empty item, ready to fill in, and with the count
// rules not yet surfaced — they only turn red once SAVE has been attempted.
function hbDefaults() {
  return { hb_items:[hbNewItem()], hb_typography:'Text 1', hb_showDesktop:false, hb_showItemErrors:false };
}
function hbNewItem() { return { image:'', label:'', link:'', open:true }; }

// Highlights Bar ships as a single authored variant rather than the shared demo
// list, so opening the component shows one row with five items already added.
function hbVariants() {
  return [{ id: 1, name: 'Category highlights', status: 'active', pubStatus: 'Live' }];
}
function hbSeeded() {
  const item = (slug, label, open) => ({
    image: `https://cdn.oakandluna.com/digital-asset/banners/highlights-${slug}.jpg`,
    label,
    link: `https://www.oakandluna.com/collections/${slug}`,
    open,
  });
  return {
    hb_items: [
      item('new-in', 'New In', true),
      item('bestsellers', 'Bestsellers', false),
      item('necklaces', 'Necklaces', false),
      item('bracelets', 'Bracelets', false),
      item('earrings', 'Earrings', false),
    ],
    hb_typography: 'Text 1',
    hb_showDesktop: false,
    hb_showItemErrors: false,
  };
}

const HB_MIN_ITEMS = 4;
const HB_MIN_DESKTOP_ITEMS = 7;
const HB_ERR = '#e53935';

// the desktop row is wider than the mobile one, so it needs more items before it
// has anything to scroll — hence the two separate minimums
function hbMinError(s)     { return s.hb_items.length < HB_MIN_ITEMS ? `At least ${HB_MIN_ITEMS} items are required` : null; }
function hbDesktopError(s) { return s.hb_showDesktop && s.hb_items.length < HB_MIN_DESKTOP_ITEMS ? `At least ${HB_MIN_DESKTOP_ITEMS} items are required when Show on Desktop is enabled` : null; }

// Image is the only mandatory field on a row; Label Text and Link URL are both
// optional, so an item with just an image is publishable.
function highlightsBarErrors(s) {
  const blocked = hbMinError(s) || hbDesktopError(s) || s.hb_items.some(it => !it.image.trim());
  return blocked ? { hb_showItemErrors: true } : null;
}
function hbErrText(msg) {
  return h('div', { style:{ fontSize:'13px', color:HB_ERR, marginTop:'7px' }}, msg);
}

function setHbItem(i, patch) { setState(p=>({ hb_items:p.hb_items.map((x,j)=>j===i?{...x,...patch}:x) })); }
function hbAddItem()         { setState(p=>({ hb_items:[...p.hb_items, hbNewItem()] })); }
function hbRemoveItem(i)     { setState(p=>({ hb_items:p.hb_items.filter((_,j)=>j!==i) })); }
function hbToggleItem(i)     { setHbItem(i, { open: !state.hb_items[i].open }); }

// Reordering keeps its cursor in a module variable rather than in state: setState
// re-renders, and replacing the dragged node mid-gesture cancels the drag.
let _hbDrag = null;
function hbMove(from, to) {
  if (from == null || from === to) return;
  setState(p => {
    const arr = [...p.hb_items];
    const [moved] = arr.splice(from, 1);
    // removing the item first shifts every later index down by one
    arr.splice(from < to ? to - 1 : to, 0, moved);
    return { hb_items: arr };
  });
}

// An empty field renders nothing at all in the storefront, so there is no empty
// circle standing in for an image that has not been chosen yet.
function hbCircle(url, size) {
  if (!url || !url.trim()) return null;
  const box = h('div', { style:{ width:size+'px', height:size+'px', borderRadius:'50%', flexShrink:'0', overflow:'hidden', background:'rgba(0,0,0,0.06)', border:'1px solid rgba(0,0,0,0.12)' }});
  box.appendChild(h('img', { src:url.trim(),
    onError: e => { e.currentTarget.style.display = 'none'; },
    style:{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}));
  return box;
}

function hbItemCard(s, item, i) {
  const imgMissing = s.hb_showItemErrors && !item.image.trim();
  const card = h('div', {
    onDragStart: e => { _hbDrag = i; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} },
    // the drop line is painted straight onto the node: re-rendering here would
    // tear down the element the browser is dragging over
    onDragOver: e => {
      e.preventDefault();
      const r = card.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      card.dataset.dropAfter = after ? '1' : '0';
      card.style.boxShadow = after ? 'inset 0 -3px 0 #1976d2' : 'inset 0 3px 0 #1976d2';
    },
    onDragLeave: () => { card.style.boxShadow = ''; },
    onDrop: e => { e.preventDefault(); const after = card.dataset.dropAfter === '1'; card.style.boxShadow = ''; hbMove(_hbDrag, after ? i + 1 : i); _hbDrag = null; },
    onDragEnd: () => { card.draggable = false; card.style.boxShadow = ''; _hbDrag = null; },
    style:{ border:'1px solid rgba(0,0,0,0.14)', borderRadius:'8px', background:'#fff', marginBottom:'14px', maxWidth:'1200px' }},

    h('div', { style:{ display:'flex', alignItems:'center', gap:'4px', padding:'16px 20px' }},
      // the row only becomes draggable while the handle is held, so text in the
      // inputs stays selectable
      h('div', { class:'tb', title:'Drag to reorder',
        onMouseDown: () => { card.draggable = true; },
        onMouseUp:   () => { card.draggable = false; },
        style:{ width:'28px', height:'28px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'grab', color:'rgba(0,0,0,0.38)' }},
        icon('drag_indicator',{fontSize:'20px'})
      ),
      h('div', { onClick:()=>hbToggleItem(i), style:{ display:'flex', alignItems:'center', gap:'8px', flex:'1', cursor:'pointer' }},
        icon(item.open ? 'expand_less' : 'expand_more', { fontSize:'20px', color:'rgba(0,0,0,0.54)' }),
        h('div', { style:{ fontSize:'15px', fontWeight:'600' }}, 'Item ' + (i+1))
      ),
      h('div', { class:'tb', title:'Delete item', onClick:()=>hbRemoveItem(i),
        style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer', color:'rgba(0,0,0,0.45)', flexShrink:'0' }},
        icon('close',{fontSize:'20px'})
      )
    ),
    !item.open ? null : h('div', { style:{ display:'grid', gridTemplateColumns:'160px 1fr', gap:'18px 20px', alignItems:'start', padding:'0 20px 22px', maxWidth:'1000px' }},
      fLabel('Image*:'),
      h('div', {},
        h('div', { style:{ display:'flex', alignItems:'center', gap:'14px' }},
          fInput(item.image, e=>setHbItem(i,{image:e.target.value}), { color:'#1976d2',
            placeholder:'https://cdn.example.com/digital-asset/banners/highlight-1.jpg',
            style:{ flex:'1', minWidth:'0', maxWidth:'620px', borderColor: imgMissing ? HB_ERR : 'rgba(0,0,0,0.23)' }}),
          hbCircle(item.image, 44)
        ),
        imgMissing ? hbErrText('Image is required') : null
      ),
      fLabel('Label Text:'), fInput(item.label, e=>setHbItem(i,{label:e.target.value}), { placeholder:'e.g. "New In"', style:{ maxWidth:'620px' }}),
      fLabel('Link URL:'),   fInput(item.link,  e=>setHbItem(i,{link:e.target.value}),  { placeholder:'https://www.example.com/collections/new-in', style:{ maxWidth:'620px' }}),
    )
  );
  return card;
}

function buildHighlightsBarTemplate(s) {
  // both count rules stay silent until SAVE is pressed, so a fresh variant
  // never opens already showing red
  const minErr = s.hb_showItemErrors ? hbMinError(s) : null;
  const dtErr  = s.hb_showItemErrors ? hbDesktopError(s) : null;
  const n = s.hb_items.length;
  const divider = () => h('div', { style:{ height:'1px', background:'rgba(0,0,0,0.12)', margin:'36px 0', maxWidth:'1200px' }});

  return h('div', {},
    // ── Items ──
    h('div', { class:'section-title', style:{ marginTop:'0' }}, 'Items:'),
    ...s.hb_items.map((item,i) => hbItemCard(s, item, i)),
    n === 0 ? h('div', { style:{ maxWidth:'1200px', padding:'22px', border:'1px dashed rgba(0,0,0,0.18)', borderRadius:'8px', fontSize:'14px', color:'rgba(0,0,0,0.5)' }}, 'No items yet.') : null,
    h('div', { class:'add-item-row' },
      h('div', { class:'add-btn', onClick:hbAddItem }, icon('add',{fontSize:'18px'}), 'ADD ITEM'),
      h('div', { style:{ marginLeft:'auto', fontSize:'14px', color:'rgba(0,0,0,0.6)' }}, n === 1 ? '1 item added' : n + ' items added')
    ),
    minErr ? hbErrText(minErr) : null,

    divider(),

    // ── Display Settings ──
    h('div', { class:'section-title', style:{ marginTop:'0' }}, 'Display Settings:'),
    h('div', { style:{ display:'grid', gridTemplateColumns:'190px 1fr', gap:'20px 24px', alignItems:'center', maxWidth:'1200px' }},
      ...centerRow('Typography Variant:', fSelect(s.hb_typography, HB_TYPOGRAPHY, e=>setState({hb_typography:e.target.value}), { minWidth:'190px' })),
      h('div', { style:{ fontSize:'16px', alignSelf: dtErr ? 'start' : 'center' }}, 'Show on Desktop:'),
      h('div', {},
        checkboxRow(s.hb_showDesktop, '', ()=>setState(p=>({hb_showDesktop:!p.hb_showDesktop}))),
        dtErr ? hbErrText(dtErr) : null
      )
    )
  );
}

// The Old Reference banner keeps the item-list rules; every other component
// keys off its own name.
function activeValidator(s) {
  if (s.section === 'banners') return s.componentTitle === OLD_REFERENCE_BANNER && s.ref_template !== '2' ? highlightsBarErrors : null;
  return COMPONENT_VALIDATORS[s.componentTitle];
}

// component title → the validation that has to pass before SAVE confirms
const COMPONENT_VALIDATORS = {
  'Shipping Promotion': shippingPromotionErrors,
  'Feedback Form':      feedbackFormErrors,
  'Nested Products':    nestedProductsErrors,
};

// ── AI REVIEW SUMMARY template ────────────────────────────────────────────────
function buildAiTemplate(s) {
  return h('div', {},
    h('div', { class:'section-title' }, 'PDP Content:'),
    fieldGrid(
      [fLabel('Summary Text*:'),
       h('div', { style:{ border:'1px solid rgba(0,0,0,0.23)', borderRadius:'6px', overflow:'hidden' }},
         aiRichToolbar(),
         h('div', { contenteditable:'true',
           ref:(el)=>{ if(el&&!el.dataset.bound){ el.dataset.bound='1'; el.innerHTML=_aiRichHTML; }},
           onInput:(e)=>{ _aiRichHTML=e.currentTarget.innerHTML; },
           style:{ minHeight:'140px', background:'#fff', padding:'14px 16px', fontSize:'15px', lineHeight:'1.5' }
         })
       )],
      centerRow('Show on Product Reviews:', toggle(s.ai_showOnReviews, ()=>setState(p=>({ai_showOnReviews:!p.ai_showOnReviews})))),
    ),
    h('div', { class:'section-title' }, 'Panel Content:'),
    fieldGrid(
      [fLabel('Title*:'), fInput(s.ai_panelTitle, e=>setState({ai_panelTitle:e.target.value}), {placeholder:'e.g "Customers Are Saying"'})],
      [fLabel('Based on text*:'), fInput(s.ai_basedOn, e=>setState({ai_basedOn:e.target.value}), {placeholder:'Based on {{numberOfReviews}} reviews'})],
      [fLabel('AI Disclaimer*:'), fInput(s.ai_disclaimer, e=>setState({ai_disclaimer:e.target.value}), {placeholder:'e.g "AI Generated from Customer Reviews"'})],
      [fLabel('CTA Text*:'), fInput(s.ai_ctaText, e=>setState({ai_ctaText:e.target.value}), {placeholder:'Read All Reviews'})],
    ),
    h('div', { class:'section-title' }, 'Topics:'),
    accordion(
      s.ai_topics,
      (item, i) => [
        fLabel('Topic:'), fInput(item.topic, e=>{ const v=e.target.value; setState(p=>({ ai_topics:p.ai_topics.map((x,j)=>j===i?{...x,topic:v}:x) })); }, {placeholder:'e.g., "Quality"'}),
        fLabel('Summary:'), fTextarea(item.summary, e=>{ const v=e.target.value; setState(p=>({ ai_topics:p.ai_topics.map((x,j)=>j===i?{...x,summary:v}:x) })); }, {placeholder:'Enter topic summary...'}),
        fLabel('Mention Text:'), fInput(item.mention, e=>{ const v=e.target.value; setState(p=>({ ai_topics:p.ai_topics.map((x,j)=>j===i?{...x,mention:v}:x) })); }, {placeholder:'e.g., "Mentioned in 120 reviews"'}),
      ],
      (i)=>setState(p=>({ ai_topics:p.ai_topics.map((x,j)=>j===i?{...x,open:!x.open}:x) })),
      (i)=>setState(p=>({ ai_topics:p.ai_topics.filter((_,j)=>j!==i) }))
    ),
    addItemRow(s.ai_topics.length, 5, 'topics', ()=>setState(p=>({ ai_topics:[...p.ai_topics,{topic:'',summary:'',mention:'',open:true}] }))),
    h('div', { style:{ display:'grid', gridTemplateColumns:'160px 1fr', gap:'20px 24px', alignItems:'center', maxWidth:'1200px', marginTop:'28px' }},
      ...centerRow('Show Review Highlights:', toggle(s.ai_showHighlights, ()=>setState(p=>({ai_showHighlights:!p.ai_showHighlights}))))
    )
  );
}

// ── POPUP MEDIA template ──────────────────────────────────────────────────────
let _popupRichHTML = '';

function richToolbar(style = 'Default Regular') {
  const btn = (ico, cmd, val) => h('div', { class:'tb', onClick:()=>execCmd(cmd,val), style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer' }}, icon(ico,{fontSize:'22px'}));
  const sep = () => h('div', { style:{ width:'1px', height:'24px', background:'rgba(0,0,0,0.12)', margin:'0 6px' }});
  return h('div', { style:{ display:'flex', alignItems:'center', gap:'2px', padding:'8px 10px', borderBottom:'1px solid rgba(0,0,0,0.12)', flexWrap:'wrap' }},
    h('div', { style:{ display:'flex', alignItems:'center', gap:'6px', padding:'6px 10px', border:'1px solid rgba(0,0,0,0.15)', borderRadius:'5px', fontSize:'14px', marginRight:'10px', cursor:'default' }}, style, icon('arrow_drop_down',{fontSize:'20px'})),
    h('div', { class:'tb', onClick:()=>execCmd('foreColor','#1976d2'), style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer' }}, h('span',{style:{width:'16px',height:'16px',borderRadius:'50%',background:'#334155',display:'block'}})),
    sep(),
    btn('format_bold','bold'), btn('format_italic','italic'), btn('format_underlined','underline'),
    sep(),
    btn('format_align_left','justifyLeft'), btn('format_align_center','justifyCenter'), btn('format_align_right','justifyRight'),
    sep(),
    btn('format_list_bulleted','insertUnorderedList'),
    h('div', { class:'tb', onClick:()=>{ const u=window.prompt('Link URL'); if(u) execCmd('createLink',u); }, style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'pointer', marginLeft:'auto' }}, icon('link')),
  );
}
function richEditor(getHTML, setHTML) {
  return h('div', { contenteditable:'true',
    ref:(el)=>{ if(el&&!el.dataset.bound){ el.dataset.bound='1'; el.innerHTML=getHTML(); }},
    onInput:(e)=>setHTML(e.currentTarget.innerHTML),
    style:{ minHeight:'170px', background:'#fff', padding:'18px 20px', fontSize:'16px', lineHeight:'1.5' }
  });
}
function setMediaType(i, t) { setState(p=>({ pm_media: p.pm_media.map((m,idx)=>idx===i?{...m,type:t}:m) })); }
function setMediaField(i, key, val) { setState(p=>({ pm_media: p.pm_media.map((m,idx)=>idx===i?{...m,[key]:val}:m) })); }
function addMedia() { setState(p=> p.pm_media.length>=6 ? p : ({ pm_media:[...p.pm_media,{type:'image',url:'',vimeo:''}] })); }
function removeMedia(i) { setState(p=>({ pm_media: p.pm_media.filter((_,idx)=>idx!==i) })); }

// ── HERO BANNER ───────────────────────────────────────────────────────────────
// Option lists. Copy for these is not pinned down in the spec — see the notes in
// the handoff; the values below are the working assumption.
const HERO_TYPOGRAPHY = ['headline1','headline2','headline3','headline4','subtitle1','body1'];
const HERO_PEEK       = ['None','Small (8px)','Medium (16px)','Large (24px)'];
const HERO_GAP        = ['0','4px','8px','12px','16px','24px'];
const HERO_ARROWS     = ['Hidden','On hover','Always'];
const HERO_DOTS       = ['Hidden','Always'];
const HERO_MAX_VISIBLE = { mobile: 4, desktop: 8 };

function heroDefaults() {
  return {
    hero_title: 'Summer Edit',
    hero_typography: 'headline2',
    hero_align: 'left',
    hero_ctas: [],
    hero_layout: 'carousel',
    hero_mobile:  { visible: 1, peek: 'Small (8px)', gap: '8px',  arrows: 'Hidden',   dots: 'Always' },
    hero_desktop: { visible: 3, peek: 'None',        gap: '16px', arrows: 'On hover', dots: 'Hidden' },
    hero_desktopVisible: true,
    hero_autoplay: false,
    hero_loop: true,
    hero_slides: [
      { ...heroNewSlide(), responsive:true, mobileImage:true, desktopImage:true, textLayer:true,
        texts:[{ text:'The Art of the Spring Stack', typography:'headline2' }],
        products:[ hsSeedProduct('OAL-NCK-1042', [26,38], [34,30]),
                   hsSeedProduct('OAL-BRC-2287', [52,64], [56,52]),
                   hsSeedProduct('OAL-ERG-0915', [74,32], [66,74]) ],
        pinStyle: hsSeedPinStyle() },
      { ...heroNewSlide(), open:false, image:true },
    ],
    hero_dirty: false,
  };
}

// A new variant opens blank — the seeded title and slides belong to the authored
// variant, not to every variant of the component.
function heroBlank() {
  return { ...heroDefaults(), hero_title:'', hero_ctas:[], hero_slides:[] };
}

// every Hero Banner edit marks the variant dirty, which is what lights up SAVE
function setHero(patch) { setState(p => (typeof patch === 'function' ? { ...patch(p), hero_dirty:true } : { ...patch, hero_dirty:true })); }
function setHeroDevice(key, patch) { setHero(p => ({ [key]: { ...p[key], ...patch } })); }
function setHeroSlide(i, patch)   { setHero(p => ({ hero_slides: p.hero_slides.map((s,j)=> j===i ? {...s, ...patch} : s) })); }

// ── shared controls ───────────────────────────────────────────────────────────
function heroSeg(value, options, onPick, opts) {
  opts = opts || {};
  return h('div', { class:'hero-seg' },
    ...options.map(([key, label, ico]) =>
      h('div', { class:'hero-seg-btn' + (value===key ? ' on' : '') + (opts.iconOnly ? ' icon-only' : ''),
        title: opts.iconOnly ? label : '', onClick: ()=>onPick(key) },
        ico ? icon(ico, { fontSize:'19px' }) : null,
        opts.iconOnly ? null : label
      )
    )
  );
}
function heroSelect(value, options, onPick, style) {
  const sel = h('select', { class:'hero-select', style: style || {}, onInput: e=>onPick(e.target.value) });
  options.forEach(o => { const opt = h('option', { value:o }, o); if (o === value) opt.selected = true; sel.appendChild(opt); });
  return sel;
}
function heroStepper(value, min, max, onSet) {
  const step = (delta, disabled) => h('div', {
    class:'hero-step-btn' + (disabled ? ' off' : ''),
    onClick: disabled ? undefined : ()=>onSet(value + delta) },
    icon(delta < 0 ? 'remove' : 'add', { fontSize:'18px' }));
  return h('div', { class:'hero-step' },
    step(-1, value <= min),
    h('div', { class:'hero-step-val' }, String(value)),
    step(1, value >= max)
  );
}
function heroField(label, ...controls) {
  return h('div', { class:'hero-field' },
    h('div', { class:'hero-label' }, label),
    h('div', { class:'hero-ctrls' }, ...controls)
  );
}
function heroBadge(text, ico, cls) {
  return h('div', { class:'hero-badge' + (cls ? ' ' + cls : '') }, ico ? icon(ico, { fontSize:'14px' }) : null, text);
}
function heroCard(title, actions, ...body) {
  return h('div', { class:'hero-card' },
    h('div', { class:'hero-card-head' },
      h('div', { class:'hero-h2' }, title),
      actions ? h('div', { class:'hero-head-actions' }, actions) : null
    ),
    ...body
  );
}

// ── 1. Header ─────────────────────────────────────────────────────────────────
function heroHeaderSection(s) {
  return heroCard('Header',
    h('div', { class:'hero-btn hero-btn-outline sm', onClick:()=>setHero(p=>({ hero_ctas:[...p.hero_ctas, { label:'', url:'' }] })) },
      icon('add',{fontSize:'18px'}), 'Add CTA Button'),
    h('div', { class:'hero-fields' },
      heroField('Title',
        h('input', { class:'hero-input', value:s.hero_title, placeholder:'Banner title', onInput:e=>setHero({hero_title:e.target.value}) }),
        heroSelect(s.hero_typography, HERO_TYPOGRAPHY, v=>setHero({hero_typography:v}), { minWidth:'150px' }),
        heroSeg(s.hero_align, [['left','Align left','format_align_left'],['center','Align center','format_align_center'],['right','Align right','format_align_right']],
          v=>setHero({hero_align:v}), { iconOnly:true })
      ),
      ...s.hero_ctas.map((cta, i) =>
        heroField('CTA Button ' + (i+1),
          h('input', { class:'hero-input', value:cta.label, placeholder:'Button label', style:{ minWidth:'150px' },
            onInput:e=>{ const v=e.target.value; setHero(p=>({ hero_ctas:p.hero_ctas.map((c,j)=>j===i?{...c,label:v}:c) })); }}),
          h('input', { class:'hero-input', value:cta.url, placeholder:'https://…',
            onInput:e=>{ const v=e.target.value; setHero(p=>({ hero_ctas:p.hero_ctas.map((c,j)=>j===i?{...c,url:v}:c) })); }}),
          h('div', { class:'tb', title:'Remove CTA button', onClick:()=>setHero(p=>({ hero_ctas:p.hero_ctas.filter((_,j)=>j!==i) })),
            style:{ width:'34px', height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'6px', cursor:'pointer', color:'rgba(0,0,0,0.45)' }},
            icon('close',{fontSize:'20px'}))
        )
      )
    )
  );
}

// ── 2. Display Settings ───────────────────────────────────────────────────────
// A banner can run mobile-only: hiding desktop drops the component on desktop
// entirely, so the desktop settings stop applying.
function heroDesktopHidden(s) { return s.hero_desktopVisible === false; }

function heroDevicePane(s, key, label, ico, hideable) {
  const d = s[key];
  const max = HERO_MAX_VISIBLE[key === 'hero_mobile' ? 'mobile' : 'desktop'];
  const hidden = hideable && heroDesktopHidden(s);
  return h('div', { class:'hero-pane' },
    h('div', { class:'hero-pane-head' }, icon(ico,{fontSize:'17px'}), label,
      hideable ? h('div', { class:'hero-eye hero-tip below', 'data-tooltip': hidden ? 'Show on desktop' : 'Hide on desktop',
        onClick:()=>setHero({ hero_desktopVisible: hidden }) },
        icon(hidden ? 'visibility_off' : 'visibility', { fontSize:'19px' })) : null
    ),
    hidden ? h('div', { class:'hero-pane-note' }, 'Hidden on desktop — this banner shows on mobile only.') : null,
    h('div', { class:'hero-pane-fields' + (hidden ? ' off' : '') },
      h('div', { class:'hero-field' },
        h('div', { class:'hero-label' }, `Visible items (max: ${max})`),
        heroStepper(d.visible, 1, max, v=>setHeroDevice(key, { visible:v }))
      ),
      h('div', { class:'hero-field' }, h('div', { class:'hero-label' }, 'Next item peek'), heroSelect(d.peek,   HERO_PEEK,   v=>setHeroDevice(key,{peek:v}))),
      h('div', { class:'hero-field' }, h('div', { class:'hero-label' }, 'Gap'),            heroSelect(d.gap,    HERO_GAP,    v=>setHeroDevice(key,{gap:v}))),
      h('div', { class:'hero-field' }, h('div', { class:'hero-label' }, 'Arrows'),         heroSelect(d.arrows, HERO_ARROWS, v=>setHeroDevice(key,{arrows:v}))),
      h('div', { class:'hero-field' }, h('div', { class:'hero-label' }, 'Dots'),           heroSelect(d.dots,   HERO_DOTS,   v=>setHeroDevice(key,{dots:v})))
    )
  );
}
function heroDisplaySection(s) {
  return heroCard('Display Settings', null,
    h('div', { style:{ marginBottom:'var(--mui-spacing-2-half)' }},
      heroSeg(s.hero_layout, [['carousel','Carousel','view_carousel'],['grid','Grid','grid_view']], v=>setHero({hero_layout:v}))
    ),
    h('div', { class:'hero-cluster' },
      heroDevicePane(s, 'hero_mobile',  'Mobile',  'phone_iphone'),
      heroDevicePane(s, 'hero_desktop', 'Desktop', 'desktop_windows', true),
      h('div', { class:'hero-pane' },
        h('div', { class:'hero-pane-head' }, icon('tune',{fontSize:'17px'}), 'Shared'),
        h('div', { class:'hero-field' }, h('div', { class:'hero-label' }, 'Autoplay'), toggle(s.hero_autoplay, ()=>setHero(p=>({hero_autoplay:!p.hero_autoplay})))),
        h('div', { class:'hero-field' }, h('div', { class:'hero-label' }, 'Loop'),     toggle(s.hero_loop,     ()=>setHero(p=>({hero_loop:!p.hero_loop}))))
      )
    )
  );
}

// ── 3. Slides ─────────────────────────────────────────────────────────────────
let _heroDrag = null;
function heroMoveSlide(from, to) {
  if (from == null || from === to) return;
  setHero(p => {
    const arr = [...p.hero_slides];
    const [moved] = arr.splice(from, 1);
    arr.splice(from < to ? to - 1 : to, 0, moved);
    return { hero_slides: arr };
  });
}

// a product without a placement on this device simply has no pin here; the
// number still follows its place in the list so it matches the tagged card
function heroImageSlot(label, present, products, device, frameCls, optional, onUpload) {
  return h('div', { class:'hero-slot' },
    h('div', { class:'hero-slot-label' }, label + (optional ? ' (optional)' : '')),
    h('div', { class:'hero-frame ' + frameCls },
      present ? products.map((p, i) => p[device]
        ? h('div', { class:'hero-pin abs', style:{ left:p[device].x+'%', top:p[device].y+'%' }, title:p.sku }, String(i+1))
        : null
      ) : h('div', { class:'hero-frame-empty' }, icon('image',{fontSize:'26px'}), 'No image')
    ),
    h('div', { class:'hero-link', onClick:onUpload }, icon('sync',{fontSize:'16px'}), present ? 'Replace Image' : 'Upload Image')
  );
}

// The Shoppable Image card, shared by hero slides and Category Images. `shop`
// holds the images, tagged products and open state; onPatch writes to wherever
// it lives, onEdit opens the hotspot editor on it, onRemove (optional) adds a
// Remove action, and `extra` is nested at the bottom of the card's body.
function shoppableCard(shop, { onPatch, onEdit, onRemove, extra }) {
  const n = shop.products.length;
  return h('div', { class:'hero-shop' },
    h('div', { class:'hero-shop-head', onClick:()=>onPatch({ shopOpen: !shop.shopOpen }) },
      icon(shop.shopOpen ? 'expand_less' : 'expand_more', { fontSize:'20px', color:'rgba(0,0,0,0.54)' }),
      h('div', { class:'hero-layer-title' }, 'Shoppable Image'),
      h('div', { style:{ marginLeft:'auto', display:'flex', alignItems:'center', gap:'var(--mui-spacing-1)' }},
        heroBadge('Position pre-configured', 'lock', 'pill'),
        onRemove ? h('div', { class:'hero-btn sm hs-btn-danger', onClick:e=>{ e.stopPropagation(); onRemove(); } }, icon('delete',{fontSize:'18px'}), 'Remove') : null)
    ),
    !shop.shopOpen ? null : h('div', { class:'hero-shop-body' },
      h('div', { class:'hero-shop-grid' },
        heroImageSlot('Desktop image', shop.desktopImage, shop.products, 'desktop', 'desktop', false, ()=>onPatch({ desktopImage:true })),
        heroImageSlot('Mobile image',  shop.mobileImage,  shop.products, 'mobile',  'mobile',  true,  ()=>onPatch({ mobileImage:true })),
        h('div', { class:'hero-summary' },
          h('div', { class:'hero-summary-n' }, n === 1 ? '1 product tagged on this image' : `${n} products tagged on this image`),
          h('div', { class:'hero-btn hero-btn-outline sm', onClick:onEdit }, icon('edit_location_alt',{fontSize:'18px'}), 'Edit Shoppable Image'),
          heroBadge(n === 1 ? '1 product' : n + ' products', 'sell', 'pill'),
          h('div', { class:'hero-prods-wrap' },
            h('div', { class:'hero-slot-label', style:{ marginBottom:'var(--mui-spacing-1)' }}, 'Tagged Products'),
            n === 0
              ? h('div', { class:'hero-empty sm' },
                  icon('sell',{fontSize:'22px'}),
                  h('div', {}, 'No products tagged yet.'),

function heroSlideCard(s, slide, i) {

    onDragOver: e => {

      card.style.boxShadow = after ? 'inset 0 -3px 0 var(--mui-palette-primary-main)' : 'inset 0 3px 0 var(--mui-palette-primary-main)';

    onDragEnd: () => { card.draggable = false; card.style.boxShadow = ''; _heroDrag = null; }},

// Pointer-driven sorting: rows slide out of the way while dragging and the list
// only re-renders on drop, since every setState rebuilds the DOM. `threshold`
// keeps a plain click on a rail slide a click (production: 4px activation).
let _bbSuppressClick = false;
function bbSortable(e, opts) {
  if (e.button !== 0) return;
  const item = opts.item, list = item.parentElement;
  const items = Array.from(list.querySelectorAll(opts.selector));
  const from = items.indexOf(item);
  if (from < 0 || items.length < 2) return;
  const rects = items.map(el => el.getBoundingClientRect());
  const shift = rects[from].height + Math.max(0, rects[1].top - rects[0].bottom);
  const startY = e.clientY;
  let to = from, active = false;
  if (!opts.threshold) e.preventDefault();
  const move = ev => {
    const dy = ev.clientY - startY;
    if (!active) {
      if (Math.abs(dy) < (opts.threshold || 0)) return;
      active = true; item.classList.add('is-dragging'); list.classList.add('is-sorting');
    }
    ev.preventDefault();
    const d = Math.max(rects[0].top - rects[from].top, Math.min(rects[items.length - 1].bottom - rects[from].bottom, dy));
    item.style.transform = `translateY(${d}px)`;
    // the pointer picks the slot, so a tall row can still be dropped first or last
    to = items.reduce((n, el, i) => n + (i !== from && rects[i].top + rects[i].height / 2 < ev.clientY ? 1 : 0), 0);
    items.forEach((el, i) => {
      if (i === from) return;
      const t = from < to && i > from && i <= to ? -shift : from > to && i >= to && i < from ? shift : 0;
      el.style.transform = t ? `translateY(${t}px)` : '';
    });
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (!active) return;
    _bbSuppressClick = true; setTimeout(() => { _bbSuppressClick = false; }, 0);
    items.forEach(el => { el.style.transform = ''; });
    item.classList.remove('is-dragging'); list.classList.remove('is-sorting');
    if (to !== from) opts.onCommit(from, to);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

// ─── SHOPPABLE HOTSPOT EDITOR ─────────────────────────────────────────────────
// The modal behind "Edit Shoppable Image", ported from site-experience-manager's
// hotspotEditor (develop) so its pin styling can be reworked for review:
//  • size runs 4–8% of the image width (production goes down to 1%, too small to see or tap)
//  • the Plus pin gains an optional filled background and its own + color; the
//    outline becomes a switch that reuses the + color
//  • opacity is gone
//  • style is set once per device and applies to every pin on it, rather than
//    per product; products only carry a position per device
// Edits happen on a draft (state.hs) and only reach the slide on Save.
const HS_MAX_PINS = 6;
const HS_SIZE = { min:4, max:8, step:0.5 };
const HS_SKUS = ['OAL-NCK-1042','OAL-BRC-2287','OAL-ERG-0915','OAL-RNG-3310','OAL-NCK-1188','OAL-ERG-0472','OAL-BRC-2051','110-62-5036-11'];

// function declarations, not consts: heroDefaults() seeds pins while the
// initial state is still being built
function hsDefaultStyle() {
  return { shape:'plus', size:4, color:'#000000', bg:false, bgColor:'#ffffff', outline:true, pulse:false };
}
function hsPinStyleDefaults() {
  return { desktop: hsDefaultStyle(), mobile: hsDefaultStyle() };
}
function hsSeedPinStyle() {
  const style = () => ({ ...hsDefaultStyle(), size:5, bg:true, outline:false });
  return { desktop: style(), mobile: style() };
}
function hsSeedProduct(sku, [dx, dy], [mx, my]) {
  return { id:sku, sku, desktop:{ x:dx, y:dy }, mobile:{ x:mx, y:my } };
}

function hsHex(v) { return /^#[0-9a-f]{6}$/i.test(v || '') ? v : null; }
function hsClamp(v) { return Math.round(Math.min(100, Math.max(0, v)) * 10) / 10; }

// Drawn in a 24-unit box and scaled to the pin, which is sized as a % of the
// image width, so it reads the same here as on the storefront.
function hsPinMarkup(st) {
  const color = hsHex(st.color) || '#000000';
  if (st.shape === 'dot') {
    return (st.pulse ? `<span class="hs-pulse" style="--pin:${color}"></span>` : '') +
      `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${color}"/></svg>`;
  }
  const a = 5.28;
  // with the outline on, the fill sits inside the ring; without it, it fills the pin
  const fill = st.bg ? `<circle cx="12" cy="12" r="${st.outline ? 11 : 12}" fill="${hsHex(st.bgColor) || '#ffffff'}"/>` : '';
  const ring = st.outline ? `<circle cx="12" cy="12" r="11" fill="none" stroke="${color}" stroke-width="1.38"/>` : '';
  return `<svg viewBox="0 0 24 24">${fill}${ring}<path d="M${12-a} 12H${12+a}M12 ${12-a}V${12+a}" stroke="${color}" stroke-width="2.18" stroke-linecap="round"/></svg>`;
}
function hsPaint(el, pos, st) {
  el.style.left = pos.x + '%';
  el.style.top = pos.y + '%';
  el.style.width = st.size + '%';
  el.innerHTML = hsPinMarkup(st);
}

// ── draft state ──────────────────────────────────────────────────────────────
// `target` says whose image is being edited: a hero slide (by index) or the
// Category Images variant's single shoppable image ('ci', slide 0)
function hsSource(s, d) { return d.target === 'ci' ? s.ci_shop : s.hero_slides[d.slide]; }
function hsOpen(i, target = 'hero') {
  const src = hsSource(state, { target, slide:i });
  setState({ hs: {
    slide: i,
    target,
    device: target === 'hero' && heroDesktopHidden(state) ? 'mobile' : 'desktop',
    entries: JSON.parse(JSON.stringify(src.products)),
    styles: JSON.parse(JSON.stringify(src.pinStyle || hsPinStyleDefaults())),
    open: null,     // selected product: its row and pin are highlighted
    placing: null,  // product waiting for a click on the image
  }});
  syncHash(false);
}
function hsClose() { setState({ hs:null }); syncHash(false); }
function hsSave() {
  const d = state.hs;
  if (d.target === 'ci') {
    setState(p => ({ hs:null, ci_shop: { ...p.ci_shop, products:d.entries, pinStyle:d.styles } }));
    syncHash(false);
    return;
  }
  setHero(p => ({ hs:null, hero_slides: p.hero_slides.map((sl, j) => j === d.slide ? { ...sl, products:d.entries, pinStyle:d.styles } : sl) }));
  syncHash(false);
}
function setHs(patch) { setState(p => ({ hs: { ...p.hs, ...(typeof patch === 'function' ? patch(p.hs) : patch) } })); }
function hsPlacedOn(d, device) { return d.entries.filter(e => e[device]).length; }
