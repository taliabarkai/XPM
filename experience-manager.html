function hsDevices(s, d) {
  const mobile = ['mobile','Mobile','phone_iphone'];
  return d.target === 'hero' && heroDesktopHidden(s) ? [mobile] : [['desktop','Desktop','desktop_windows'], mobile];
}

function hsAddSku(raw) {
  const sku = raw.trim();
  if (!sku) return;
  setHs(d => {
    const found = d.entries.find(e => e.sku === sku);
    const entry = found || { id:'hs-' + Date.now(), sku, desktop:null, mobile:null };
    const atCap = hsPlacedOn(d, d.device) >= HS_MAX_PINS;
    return {
      entries: found ? d.entries : [...d.entries, entry],
      open: entry.id,
      placing: !atCap && !entry[d.device] ? entry.id : null,
    };
  });
}
function hsPlace(x, y) {
  setHs(d => ({ placing:null,
    entries: d.entries.map(e => e.id === d.placing ? { ...e, [d.device]: { x, y } } : e) }));
}
function hsRemove(id) {
  setHs(d => ({ entries: d.entries.filter(e => e.id !== id),
    open: d.open === id ? null : d.open, placing: d.placing === id ? null : d.placing }));
}
function hsSetStyle(patch) {
  setHs(d => ({ styles: { ...d.styles, [d.device]: { ...d.styles[d.device], ...patch } } }));
}

// Sliders, color pickers and drags repaint pins in place and commit on
// release: a full render mid-gesture would replace the control being dragged.
// The draft is a private copy until Save, so mutating it here is safe.
function hsLive(patch) {
  const d = state.hs, st = Object.assign(d.styles[d.device], patch);
  document.querySelectorAll('.hs-canvas [data-hs-pin]').forEach(el => {
    const e = d.entries.find(x => x.id === el.dataset.hsPin);
    if (e && e[d.device]) hsPaint(el, e[d.device], st);
  });
}
function hsMove(id, el, x, y) {
  const d = state.hs, e = d.entries.find(x => x.id === id);
  if (!e || !e[d.device]) return;
  Object.assign(e[d.device], { x, y });
  hsPaint(el, e[d.device], d.styles[d.device]);
}

// ── canvas ───────────────────────────────────────────────────────────────────
function hsDragStart(ev, id, el) {
  if (ev.button !== 0 || state.hs.placing) return;
  ev.preventDefault();
  const r = el.parentNode.getBoundingClientRect();
  const sx = ev.clientX, sy = ev.clientY;
  let moved = false;
  el.classList.add('dragging');
  const move = m => {
    if (!moved && Math.hypot(m.clientX - sx, m.clientY - sy) < 3) return;
    moved = true;
    hsMove(id, el, hsClamp((m.clientX - r.left) / r.width * 100), hsClamp((m.clientY - r.top) / r.height * 100));
  };
  const up = () => {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    setHs({ open:id });
  };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}
function hsPinEl(e, pos, st, selected) {
  const el = h('div', { class:'hs-pin' + (selected ? ' on' : ''), 'data-hs-pin':e.id, title:e.sku,
    role:'button', tabindex:'0', 'aria-label':`Hotspot pin for ${e.sku}`,
    onMouseDown: ev => hsDragStart(ev, e.id, el),
    onKeyDown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setHs({ open:e.id }); } } });
  hsPaint(el, pos, st);
  return el;
}
function hsCanvas(s, d) {
  const slide = hsSource(s, d);
  const mobile = d.device === 'mobile';
  // the mobile canvas falls back to the desktop image until one is uploaded
  const ownMobile = mobile && slide.mobileImage;
  const hasImage = ownMobile || slide.desktopImage;
  const placing = hasImage && d.entries.find(e => e.id === d.placing);
  const ghost = placing ? h('div', { class:'hs-pin ghost' }) : null;
  const st = d.styles[d.device];
  if (ghost) hsPaint(ghost, { x:0, y:0 }, st);
  const at = ev => {
    const r = canvas.getBoundingClientRect();
    return [hsClamp((ev.clientX - r.left) / r.width * 100), hsClamp((ev.clientY - r.top) / r.height * 100)];
  };
  const canvas = h('div', { class:'hs-canvas ' + (ownMobile ? 'mobile' : 'desktop') + (placing ? ' placing' : ''),
      onMouseMove: ev => { if (!ghost) return; const [x, y] = at(ev); Object.assign(ghost.style, { display:'block', left:x+'%', top:y+'%' }); },
      onMouseLeave: () => { if (ghost) ghost.style.display = 'none'; },
      onClick: ev => { if (placing) hsPlace(...at(ev)); } },
    hasImage
      ? [ h('div', { class:'hs-photo' }), h('div', { class:'hs-photo-label' }, ownMobile ? 'Mobile image' : 'Desktop image') ]
      : h('div', { class:'hs-canvas-empty' }, icon('image',{fontSize:'28px'}), 'Upload an image to place pins'),
    hasImage ? d.entries.filter(e => e[d.device]).map(e => hsPinEl(e, e[d.device], st, d.open === e.id)) : null,
    ghost,
    placing ? h('div', { class:'hs-place-hint' }, `Click on the image to place ${placing.sku}`) : null
  );
  return canvas;
}
function hsCanvasCol(s, d) {
  const n = hsPlacedOn(d, d.device), full = n >= HS_MAX_PINS;
  return h('div', { class:'hs-canvas-col' },
    h('div', { class:'hs-canvas-bar' },
      d.placing
        ? h('div', { class:'hero-btn sm hs-btn-danger', onClick:()=>setHs({ placing:null }) }, icon('cancel',{fontSize:'18px'}), 'Cancel Placement')
        : h('span', {}, full ? `Max ${HS_MAX_PINS} pins reached` : 'Search a product on the right to place a pin'),
      heroBadge(`${n} of ${HS_MAX_PINS}`, null, 'pill' + (full ? ' full' : ''))
    ),
    h('div', { class:'hs-stage' }, hsCanvas(s, d))
  );
}
function hsStyleCard(d) {
  const label = d.device === 'mobile' ? 'Mobile' : 'Desktop';
  return h('div', { class:'hs-style-card' },
    h('div', { class:'hs-style-head' },
      h('div', { class:'hs-style-title' }, `${label} Pin Style`),
      h('div', { class:'hs-style-note' }, `Applies to every pin on ${d.device}`)
    ),
    hsStyleControls(d.styles[d.device])
  );
}

// ── sidebar ──────────────────────────────────────────────────────────────────
// the datalist stands in for the SKU autocomplete: picking a suggestion or
// pressing Enter commits, plain typing doesn't re-render
function hsSkuInput(value, onPick, placeholder) {
  return h('input', { class:'hero-input', value, placeholder, list:'hs-skus',
    onInput: e => { if (!e.inputType || e.inputType === 'insertReplacementText') onPick(e.target.value); },
    onKeyDown: e => { if (e.key === 'Enter') onPick(e.target.value); } });
}
function hsColorField(value, onLive, cls) {
  let swatch;
  const hex = h('input', { class:'hero-hex', value,
    onInput: e => { let v = e.target.value.trim(); if (!v.startsWith('#')) v = '#' + v; if (hsHex(v)) { swatch.style.background = v; onLive(v); } },
    onChange: () => render() });
  swatch = h('div', { class:'hero-swatch', style:{ background:value }},
    h('input', { type:'color', value,
      onInput: e => { swatch.style.background = e.target.value; hex.value = e.target.value; onLive(e.target.value); },
      onChange: () => render() }));
  return h('div', { class:'hero-color' + (cls ? ' ' + cls : '') }, swatch, hex);
}
function hsSwitch(on, label, onFlip) {
  return h('div', { class:'hs-switch', onClick:onFlip }, toggle(on, null), label);
}
function hsStyleControls(st) {
  const sizeVal = h('b', {}, st.size + '%');
  const plus = st.shape === 'plus';
  return h('div', { class:'hs-style' },
    h('div', { class:'hs-style-row' },
      h('div', {},
        h('div', { class:'hs-fl' }, 'Shape'),
        heroSeg(st.shape, [['plus','Plus','add_circle'], ['dot','Dot','circle']], v=>hsSetStyle({ shape:v }))
      ),
      // every slot is always laid out; dot only swaps or hides contents, so
      // nothing in the card moves when the shape changes
      h('div', {},
        h('div', { class:'hs-fl' }, plus ? 'Icon color' : 'Color'),
        hsColorField(st.color, v=>hsLive({ color:v }))),
      plus
        ? h('div', { class:'hs-slot-toggle', title:'The outline uses the icon color' },
            h('div', { class:'hs-fl' }, 'Outline'),
            hsSwitch(st.outline, st.outline ? 'On' : 'Off', ()=>hsSetStyle({ outline: !st.outline })))
        : h('div', { class:'hs-slot-toggle' },
            h('div', { class:'hs-fl' }, 'Pulse'),
            hsSwitch(st.pulse, st.pulse ? 'On' : 'Off', ()=>hsSetStyle({ pulse: !st.pulse }))),
      h('div', plus ? {} : { class:'hs-slot-hidden', 'aria-hidden':'true' },
        h('div', { class:'hs-fl' }, 'Background'),
        h('div', { class:'hs-bg-row' },
          hsSwitch(st.bg, st.bg ? 'Filled' : 'None', ()=>hsSetStyle({ bg: !st.bg })),
          // the color is kept while the fill is off, so switching back restores it
          hsColorField(st.bgColor, v=>hsLive({ bgColor:v }), st.bg ? '' : 'off')))
    ),
    h('div', { class:'hs-style-size' },
      h('div', { class:'hs-fl' }, 'Size', sizeVal),
      h('input', { type:'range', class:'hs-range', min:HS_SIZE.min, max:HS_SIZE.max, step:HS_SIZE.step, value:st.size,
        onInput: e => { const v = +e.target.value; sizeVal.textContent = v + '%'; hsLive({ size:v }); },
        onChange: () => render() }),
      h('div', { class:'hs-range-ends' }, h('span', {}, HS_SIZE.min + '%'), h('span', {}, HS_SIZE.max + '%'))
    )
  );
}
function hsRow(d, e, idx) {
  const open = d.open === e.id;
  const pl = e[d.device];
  const atCap = hsPlacedOn(d, d.device) >= HS_MAX_PINS;
  const placingThis = d.placing === e.id;
  return h('div', { class:'hs-row' + (open ? ' on' : '') },
    h('div', { class:'hs-row-head', onClick:()=>setHs({ open: open ? null : e.id }) },
      h('div', { class:'hs-thumb' }),
      h('div', { style:{ flex:'1', minWidth:'0' }},
        h('div', { class:'hs-row-idx' }, '#' + (idx + 1)),
        h('div', { class:'hs-row-sku' }, e.sku)),
      !pl && !atCap
        ? h('div', { class:'hs-chip-btn', onClick: ev => { ev.stopPropagation(); setHs({ placing:e.id, open:e.id }); } },
            icon('my_location',{fontSize:'14px'}), placingThis ? 'Placing…' : 'Place')
        : null,
      h('div', { class:'hero-icon-remove', title:'Remove product', onClick: ev => { ev.stopPropagation(); hsRemove(e.id); } },
        icon('delete',{fontSize:'20px'}))
    )
  );
}
function hsSidebar(s, d) {
  return h('div', { class:'hs-side scroll' },
    h('div', { class:'hs-tabs' },
      ...hsDevices(s, d).map(([key, label, ico]) => {
        const missing = d.entries.filter(e => !e[key]).length;
        return h('div', { class:'hs-tab' + (d.device === key ? ' on' : ''), onClick:()=>setHs({ device:key, open:null, placing:null }) },
          icon(ico, { fontSize:'19px' }), label,
          heroBadge(String(hsPlacedOn(d, key)), null, 'pill'),
          missing ? heroBadge(`${missing} missing`, null, 'pill warn') : null);
      })
    ),
    h('div', {},
      h('div', { class:'hs-sublabel' }, 'Add Product'),
      hsSkuInput('', hsAddSku, 'Select SKU, or paste from clipboard')
    ),
    d.entries.length === 0
      ? h('div', { class:'hero-empty sm' },
          h('div', {}, 'No products added yet'),
          h('div', { style:{ fontSize:'13px' }}, 'Search a SKU above to start'))
      : h('div', { class:'hs-rows' }, ...d.entries.map((e, idx) => hsRow(d, e, idx))),
    hsStyleCard(d)
  );
}

function hsModal(s) {
  const d = s.hs;
  if (!d || !hsSource(s, d)) return null;
  // a click outside closes it like Cancel; the press must also start outside,
  // so a pin or slider drag that ends on the backdrop doesn't throw edits away
  let downOutside = false;
  return h('div', { class:'hs-backdrop',
      onMouseDown: e => { downOutside = e.target === e.currentTarget; },
      onClick: e => { if (downOutside && e.target === e.currentTarget) hsClose(); } },
    h('div', { class:'hs-modal', role:'dialog', 'aria-modal':'true', 'aria-label':'Shoppable Hotspots' },
      h('div', { class:'hs-head' },
        h('div', { class:'hs-title' }, 'Shoppable Hotspots'),
        h('div', { class:'hs-x', title:'Close', onClick:hsClose }, icon('close',{fontSize:'22px'}))
      ),
      h('div', { class:'hs-body' }, hsCanvasCol(s, d), hsSidebar(s, d)),
      h('div', { class:'hs-foot' },
        h('div', { class:'hero-btn hero-btn-ghost', onClick:hsClose }, 'Cancel'),
        h('div', { class:'hero-btn hero-btn-primary', onClick:hsSave }, 'Save')
      ),
      h('datalist', { id:'hs-skus' }, ...HS_SKUS.map(v => h('option', { value:v })))
    )
  );
}
// Escape backs out one step: first an in-progress placement, then the editor
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !state.hs) return;
  if (state.hs.placing) setHs({ placing:null }); else hsClose();
});

// ─── NESTED PRODUCTS ──────────────────────────────────────────────────────────
// Promotions › Nested Products. Its variant page leads with the parent-SKU
// filters, so the content tab is where the nested items themselves live — hence
// the "Nested Products & Content" tab label (see editorTabs).
//
// Products are grouped into at most two sections. Each section owns its own
// product table, and — because the heading and display type were moved out of
// the table — its own block under PDP Settings, titled to match.
const NESTED_PRODUCTS = 'Nested Products';
const NP_MAX_SKUS = 6;
const NP_MAX_SECTIONS = 2;
// A Drawer section is a multi-select grid behind one PDP button, so it holds
// more products than the inline layouts, and fewer than two is not a choice.
const NP_DRAWER_MIN_SKUS = 2;
const NP_DRAWER_MAX_SKUS = 10;
const NP_ICONS = ['Select','Plus','Chevron','Gift','Shield','Sparkle','Info','Tag'];
const NP_CENTER = { display:'flex', justifyContent:'center' };

function npGrid(showVimeo) {
  return showVimeo
    ? '40px minmax(170px, 1fr) 280px 190px 70px 200px 40px'
    : '40px minmax(200px, 1fr) 280px 190px 70px 40px';
}

// A warranty row is recognised by its SKU value alone: there is no product type
// in the model yet, so the literal "warranty" is the flag.
function npIsWarranty(item) { return item.sku.trim().toLowerCase() === 'warranty'; }
// Floating Cart is only offered on warranty rows, so its settings section only
// exists once one of them — in any section — actually uses it.
function npHasFloatingCart(s) {
  return s.np_sections.some(sec => sec.items.some(it => npIsWarranty(it) && it.floatingCart));
}

// Display Location still applies to a Drawer section's rows: the drawer itself
// only holds the rows with PDP selected, and Cart keeps its own behaviour.
function npIsDrawer(section) { return section.displayType === 'drawer'; }
function npMaxSkus(section)  { return npIsDrawer(section) ? NP_DRAWER_MAX_SKUS : NP_MAX_SKUS; }

function npNewItem()    { return { sku:'', pdp:false, cart:false, floatingCart:false, ribbon:false, video:false, vimeo:'' }; }
function npNewSection() { return { heading:'', description:'', displayType:'carousel', open:true, items:[npNewItem()] }; }

// A fresh variant opens on one section holding one empty row: no SKU, no display
// location and no ribbon, so nothing is switched on that was not asked for.
function npBlank() {
  return {
    np_sections: [npNewSection()],
    np_locOpen: null,
    np_open: { products:true, pdp:true, cart:true, floating:true },
    np_cartShowAs: 'collapsed',
    np_cartIcon: 'Select',
    np_cartButtonText: '',
    np_cartHeading: '',
    np_fcText: '',
    np_fcShowPhoto: true,
    np_cartHideInCart: false,
    np_errors: null,
  };
}
// Nested Products names its variants after the promotion each one nests, so the
// panel reads as a real component rather than the shared demo list. Variant 1 is
// the warranty one — it is the table npDefaults seeds.
function npVariants() {
  return [
    { id: 1, name: 'Warranty',     status: 'active',   pubStatus: 'Live' },
    { id: 2, name: 'BOGO50',       status: 'active',   pubStatus: 'Live' },
    { id: 3, name: 'Necklace Set', status: 'active',   pubStatus: 'Draft' },
    { id: 4, name: 'Summer 2025',  status: 'archived', pubStatus: 'Archived' },
  ];
}

// The demo variants that ship with the prototype open on a filled table: a
// regular nested product plus a warranty item, so both row shapes are on screen
// without having to type one in.
function npDefaults() {
  return { ...npBlank(), np_sections: [{ heading:'', description:'', displayType:'carousel', open:true, items:[
    { sku:'110-01-4975-33', pdp:true, cart:true,  floatingCart:false, ribbon:true,  video:true,  vimeo:'1090780925' },
    { sku:'warranty',       pdp:true, cart:false, floatingCart:true,  ribbon:false, video:false, vimeo:'' },
  ]}]};
}

// ── section + row mutations ───────────────────────────────────────────────────
// any edit to a section clears the save errors, so they only reflect the last SAVE
function npMapSection(si, fn) {
  setState(p => ({ np_sections: p.np_sections.map((sec,j) => j===si ? fn(sec) : sec), np_errors:null }));
}
function setNpSection(si, patch)   { npMapSection(si, sec => ({ ...sec, ...patch })); }
function npToggleCard(si)          { npMapSection(si, sec => ({ ...sec, open: !sec.open })); }
function setNpItem(si, i, patch)   { npMapSection(si, sec => ({ ...sec, items: sec.items.map((x,j)=> j===i ? {...x, ...patch} : x) })); }
function npAddItem(si)             { npMapSection(si, sec => sec.items.length >= npMaxSkus(sec) ? sec : ({ ...sec, items:[...sec.items, npNewItem()] })); }
// the open dropdown is addressed by position, so it cannot survive a removal
function npRemoveItem(si, i)       { setState({ np_locOpen:null }); npMapSection(si, sec => ({ ...sec, items: sec.items.filter((_,j)=>j!==i) })); }
function npToggleSection(key)      { setState(p=>({ np_open: { ...p.np_open, [key]: !p.np_open[key] } })); }

function npAddSection() {
  setState(p => p.np_sections.length >= NP_MAX_SECTIONS ? p : ({ np_sections:[...p.np_sections, npNewSection()], np_locOpen:null }));
}
function npRemoveSection(si) {
  setState(p => p.np_sections.length <= 1 ? p : ({ np_sections: p.np_sections.filter((_,j)=>j!==si), np_locOpen:null }));
}

// Same approach as the Highlights Bar list: the drag cursor lives outside state,
// because re-rendering would replace the node the browser is dragging. Rows
// reorder within their own section.
let _npDrag = null;
function npMove(si, from, to) {
  if (from == null || from === to) return;
  npMapSection(si, sec => {
    const arr = [...sec.items];
    const [moved] = arr.splice(from, 1);
    // removing the item first shifts every later index down by one
    arr.splice(from < to ? to - 1 : to, 0, moved);
    return { ...sec, items: arr };
  });
}

// A Drawer section needs a heading (it is the PDP button) and at least two
// SKUs with PDP selected, since only those appear in the drawer. Errors are
// kept per section index.
function nestedProductsErrors(s) {
  const errors = {};
  s.np_sections.forEach((sec, si) => {
    if (!npIsDrawer(sec)) return;
    const heading = !sec.heading.trim();
    const tooFew = sec.items.filter(it => it.sku.trim() && it.pdp).length < NP_DRAWER_MIN_SKUS;
    if (heading || tooFew) errors[si] = { heading, tooFew };
  });
  if (!Object.keys(errors).length) return null;
  // open everything an error sits in, so SAVE always shows why it failed
  return {
    np_errors: errors,
    np_open: { ...s.np_open, products:true, pdp:true },
    np_sections: s.np_sections.map((sec, si) => errors[si] && errors[si].tooFew ? { ...sec, open:true } : sec),
  };
}

function npSection(s, key, title, ...body) {
  return collapsibleSection(s.np_open[key], ()=>npToggleSection(key), title, ...body);
}

// Every row keeps the same editable text field, warranty or not: for prototyping
// the word "warranty" is simply typed in where a catalogue code would go.
function npSkuCell(si, item, i) {
  return fInput(item.sku, e => {
    const sku = e.target.value;
    // whichever cart location the row can no longer use cannot stay selected
    const warranty = sku.trim().toLowerCase() === 'warranty';
    setNpItem(si, i, warranty ? { sku, cart:false } : { sku, floatingCart:false });
  }, { placeholder:'e.g. 110-01-4975-33 or "warranty"', style:{ maxWidth:'480px' }});
}

// Display Location is a multiselect: all three locations are listed on every
// row, and Floating Cart is only selectable on the warranty SKU.
const NP_LOCATIONS = [
  { key:'pdp',          label:'PDP' },
  { key:'cart',         label:'Cart' },
  { key:'floatingCart', label:'Floating Cart' },
];
const NP_LOC_TOOLTIP = {
  floatingCart: 'Available for the warranty SKU only',
  cart:         'Not available for the warranty SKU',
};

function npLocEnabled(item, key) {
  const warranty = npIsWarranty(item);
  if (key === 'floatingCart') return warranty;
  if (key === 'cart')         return !warranty;
  return true;
}
function npToggleLoc(si, i, key) {
  const item = state.np_sections[si].items[i];
  if (!npLocEnabled(item, key)) return;
  setNpItem(si, i, { [key]: !item[key] });
}

function npLocationCell(s, si, item, i) {
  const id = si + ':' + i;
  const open = s.np_locOpen === id;
  const chosen = NP_LOCATIONS.filter(l => item[l.key]).map(l => l.label);
  return h('div', { style:{ position:'relative', maxWidth:'280px' }},
    h('div', { onClick:()=>setState(p=>({ np_locOpen: p.np_locOpen === id ? null : id })),
      style:{ display:'flex', alignItems:'center', gap:'6px', height:'50px', padding:'0 8px 0 14px', border:`1px solid ${open?'#1976d2':'rgba(0,0,0,0.23)'}`, borderRadius:'6px', fontSize:'15px', cursor:'pointer', background:'#fff', color: chosen.length ? 'inherit' : 'rgba(0,0,0,0.45)' }},
      h('div', { style:{ flex:'1', minWidth:'0', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }},
        chosen.length ? chosen.join(', ') : 'Select'
      ),
      icon(open?'arrow_drop_up':'arrow_drop_down', { fontSize:'22px', color:'rgba(0,0,0,0.54)', flexShrink:'0' })
    ),
    !open ? null : h('div', { style:{ position:'absolute', top:'54px', left:'0', minWidth:'100%', background:'#fff', borderRadius:'6px', boxShadow:'0px 5px 5px -3px rgba(0,0,0,0.2),0px 8px 10px 1px rgba(0,0,0,0.14)', padding:'6px 0', zIndex:'25' }},
      ...NP_LOCATIONS.map(l => {
        const on = !!item[l.key];
        if (!npLocEnabled(item, l.key)) {
          return h('div', { class:'np-tip', 'data-tooltip':NP_LOC_TOOLTIP[l.key],
            style:{ display:'flex', alignItems:'center', gap:'10px', padding:'10px 16px', fontSize:'15px', color:'rgba(0,0,0,0.35)', cursor:'not-allowed' }},
            icon('check_box_outline_blank', { fontSize:'22px', color:'rgba(0,0,0,0.22)' }), l.label
          );
        }
        return h('div', { class:'panelitem', onClick:()=>npToggleLoc(si, i, l.key),
          style:{ display:'flex', alignItems:'center', gap:'10px', padding:'10px 16px', fontSize:'15px', cursor:'pointer' }},
          icon(on ? 'check_box' : 'check_box_outline_blank', { fontSize:'22px', color: on ? '#1976d2' : 'rgba(0,0,0,0.5)', fontVariationSettings: on ? "'FILL' 1" : "'FILL' 0" }), l.label
        );
      })
    )
  );
}

function npRow(s, si, item, i, showVimeo) {
  const row = h('div', { class:'np-item',
    onDragStart: e => { _npDrag = i; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} },
    // the drop line is painted straight onto the node: re-rendering here would
    // tear down the element the browser is dragging over
    onDragOver: e => {
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      row.dataset.dropAfter = after ? '1' : '0';
      row.style.boxShadow = after ? 'inset 0 -3px 0 #1976d2' : 'inset 0 3px 0 #1976d2';
    },
    onDragLeave: () => { row.style.boxShadow = ''; },
    onDrop: e => { e.preventDefault(); const after = row.dataset.dropAfter === '1'; row.style.boxShadow = ''; npMove(si, _npDrag, after ? i + 1 : i); _npDrag = null; },
    onDragEnd: () => { row.draggable = false; row.style.boxShadow = ''; _npDrag = null; },
    style:{ display:'grid', gridTemplateColumns:npGrid(showVimeo), alignItems:'center', gap:'20px', padding:'16px 20px', borderTop:'1px solid rgba(0,0,0,0.12)' }},

    // the row only becomes draggable while the handle is held, so text in the
    // SKU field stays selectable
    h('div', { class:'tb', title:'Drag to reorder',
      onMouseDown: () => { row.draggable = true; },
      onMouseUp:   () => { row.draggable = false; },
      style:{ width:'32px', height:'32px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px', cursor:'grab', color:'rgba(0,0,0,0.38)' }},
      icon('drag_indicator',{fontSize:'20px'})
    ),
    npSkuCell(si, item, i),
    npLocationCell(s, si, item, i),
    h('div', { style:NP_CENTER }, toggle(item.ribbon, ()=>setNpItem(si,i,{ribbon:!item.ribbon}))),
    h('div', { style:NP_CENTER }, toggle(item.video,  ()=>setNpItem(si,i,{video:!item.video}))),
    // the value survives toggling the video off, so turning it back on restores it
    showVimeo ? h('div', {},
      item.video
        ? fInput(item.vimeo, e=>setNpItem(si,i,{vimeo:e.target.value}), { placeholder:'e.g. 1090780925', style:{ maxWidth:'200px' }})
        : null
    ) : null,
    h('div', { class:'tb', title:'Remove item', onClick:()=>npRemoveItem(si, i),
      style:{ width:'32px', height:'32px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'50%', cursor:'pointer', color:'rgba(0,0,0,0.45)' }},
      icon('close',{fontSize:'20px'})
    )
  );
  return row;
}

// The SKU cap is per section, so each table counts its own.
function npProductsTable(s, si, section) {
  const n = section.items.length;
  const max = npMaxSkus(section);
  const full = n >= max;
  const tooFew = !!(s.np_errors && s.np_errors[si] && s.np_errors[si].tooFew);
  const showVimeo = section.items.some(it => it.video);
  return h('div', { style:{ border:'1px solid rgba(0,0,0,0.12)', borderRadius:'8px' }},
    h('div', { style:{ display:'grid', gridTemplateColumns:npGrid(showVimeo), gap:'20px', padding:'18px 20px', fontSize:'15px', color:'rgba(0,0,0,0.7)' }},
      h('div', {}), h('div', {}, 'SKU'), h('div', {}, 'Display Location'),
      h('div', { style:{ textAlign:'center' }}, 'Catalog Product Ribbon'),
      h('div', { style:{ textAlign:'center' }}, 'Video'),
      showVimeo ? h('div', {}, 'Vimeo ID') : null, h('div', {})
    ),
    ...section.items.map((item,i) => npRow(s, si, item, i, showVimeo)),
    n === 0 ? h('div', { style:{ padding:'22px 20px', borderTop:'1px solid rgba(0,0,0,0.12)', fontSize:'15px', color:'rgba(0,0,0,0.5)' }}, 'No products yet.') : null,
    h('div', { style:{ display:'flex', alignItems:'center', padding:'20px', borderTop:'1px solid rgba(0,0,0,0.12)' }},
      h('div', { class: full ? '' : 'add-btn', onClick: full ? undefined : ()=>npAddItem(si),
        title: full ? `Up to ${max} SKUs can be nested per section` : '',
        style: full
          ? { display:'inline-flex', alignItems:'center', gap:'6px', padding:'9px 20px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', color:'rgba(0,0,0,0.35)', fontSize:'14px', fontWeight:'500', letterSpacing:'.4px', cursor:'not-allowed' }
          : {}},
        icon('add',{fontSize:'18px'}), 'ADD ITEM'
      ),
      tooFew ? h('div', { style:{ marginLeft:'16px', fontSize:'13px', color:'#e53935' }}, `A Drawer section needs at least ${NP_DRAWER_MIN_SKUS} SKUs with PDP selected`) : null,
      h('div', { style:{ marginLeft:'auto', fontSize:'14px', color:'rgba(0,0,0,0.6)' }},
        npIsDrawer(section) ? `${n} of ${max} SKUs added · min ${NP_DRAWER_MIN_SKUS}` : `${n} of ${max} SKUs added`)
    )
  );
}

function npSectionTitle(si) { return 'Section ' + (si + 1); }

// One collapsible card per section, holding that section's product table.
function npSectionCard(s, section, si, removable) {
  return h('div', { style:{ border:'1px solid rgba(0,0,0,0.12)', borderRadius:'8px', marginBottom:'16px' }},
    h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', padding:'16px 20px' }},
      h('div', { onClick:()=>npToggleCard(si), style:{ display:'flex', alignItems:'center', gap:'8px', flex:'1', cursor:'pointer' }},
        icon(section.open?'expand_more':'chevron_right', { fontSize:'20px', color:'rgba(0,0,0,0.54)' }),
        h('div', { style:{ fontSize:'16px', fontWeight:'600' }}, npSectionTitle(si))
      ),
      removable ? h('div', { class:'tb', title:'Remove section', onClick:()=>npRemoveSection(si),
        style:{ width:'32px', height:'32px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'50%', cursor:'pointer', color:'rgba(0,0,0,0.45)', flexShrink:'0' }},
        icon('close',{fontSize:'20px'})
      ) : null
    ),
    section.open ? h('div', { style:{ padding:'0 20px 20px' }}, npProductsTable(s, si, section)) : null
  );
}

function npProductsSection(s) {
  const secs = s.np_sections;
  const full = secs.length >= NP_MAX_SECTIONS;
  return h('div', {},
    ...secs.map((section,si) => npSectionCard(s, section, si, secs.length > 1)),
    h('div', { style:{ display:'flex', alignItems:'center' }},
      h('div', { class: full ? '' : 'add-btn', onClick: full ? undefined : npAddSection,
        title: full ? `Up to ${NP_MAX_SECTIONS} sections` : '',
        style: full
          ? { display:'inline-flex', alignItems:'center', gap:'6px', padding:'9px 20px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', color:'rgba(0,0,0,0.35)', fontSize:'14px', fontWeight:'500', letterSpacing:'.4px', cursor:'not-allowed' }
          : {}},
        icon('add',{fontSize:'18px'}), 'ADD SECTION'
      ),
      h('div', { style:{ marginLeft:'auto', fontSize:'14px', color:'rgba(0,0,0,0.6)' }}, `${secs.length} of ${NP_MAX_SECTIONS} items added`)
    )
  );
}

function npRadios(value, options, onPick) {
  return h('div', { style:{ display:'flex', gap:'34px', flexWrap:'wrap' }},
    ...options.map(([key,label]) =>
      h('div', { onClick:()=>onPick(key), style:{ display:'flex', alignItems:'center', gap:'9px', fontSize:'16px', cursor:'pointer' }},
        h('span', { style:ringStyle(value===key) },
          value===key ? h('span',{style:{width:'11px',height:'11px',borderRadius:'50%',background:'#1976d2',display:'block'}}) : null
        ),
        label
      )
    )
  );
}

const NP_PDP_DISPLAY_TYPES = [['carousel','Carousel'], ['stacked','Stacked'], ['grid','Grid'], ['drawer','Drawer']];

const NP_SELECT_STYLE = { width:'100%', maxWidth:'1040px', height:'50px', border:'1px solid rgba(0,0,0,0.23)', borderRadius:'6px', padding:'0 12px', fontSize:'15px', background:'#fff' };

// A sub-title in the same voice as Cart Settings' "Nested Button".
function npSubTitle(text) { return h('div', { style:{ fontSize:'16px', fontWeight:'700' }}, text); }

function buildNestedProductsTemplate(s) {
  const divider = () => h('div', { style:{ height:'1px', background:'rgba(0,0,0,0.12)', margin:'34px 0', maxWidth:'1200px' }});
  const showFloating = npHasFloatingCart(s);
  return h('div', { style:{ maxWidth:'1200px' }},
    npSection(s, 'products', 'Products', npProductsSection(s)),
    divider(),
    // the heading and display type belong to a section, so they are grouped and
    // titled the same way the section cards above are
    npSection(s, 'pdp', 'PDP Settings',
      ...s.np_sections.map((section, si) => {
        const drawer = npIsDrawer(section);
        const headingError = !!(s.np_errors && s.np_errors[si] && s.np_errors[si].heading);
        return h('div', { style:{ marginTop: si ? '34px' : '0' }},
          npSubTitle(npSectionTitle(si)),
          fieldGrid(
            // the display type comes first: it decides what the fields below ask for
            ...centerRow('Display Type:', npRadios(section.displayType, NP_PDP_DISPLAY_TYPES, k=>setNpSection(si,{displayType:k}))),
            // a Drawer has no inline products, so its heading is the PDP button
            // and the drawer's title, and cannot be left empty
            fLabel(drawer ? 'Heading*:' : 'Heading:'),
            h('div', {},
              fInput(section.heading, e=>setNpSection(si,{heading:e.target.value}), {
                placeholder: 'e.g. Add More Charms',
                style:{ maxWidth:'1040px', borderColor: headingError ? '#e53935' : 'rgba(0,0,0,0.23)' }}),
              headingError
                ? h('div', { style:{ fontSize:'13px', color:'#e53935', marginTop:'7px' }}, 'Heading is required for a Drawer section')
                : null
            ),
            // Drawer only: an optional line under the heading on the PDP button
            ...(drawer ? [
              fLabel('Description:'),
              fInput(section.description || '', e=>setNpSection(si,{description:e.target.value}), {
                placeholder: 'e.g. Save 20% when you buy 2 or more charms',
                style:{ maxWidth:'1040px' }})
            ] : [])
          )
        );
      })
    ),
    divider(),
    npSection(s, 'cart', 'Cart Settings',
      npSubTitle('Nested Button'),
      fieldGrid(
        ...centerRow('Show As:', npRadios(s.np_cartShowAs, [['collapsed','Collapsed'],['expanded','Expanded']], k=>setState({np_cartShowAs:k}))),
        fLabel('Icon:'),
        fSelect(s.np_cartIcon, NP_ICONS, e=>setState({np_cartIcon:e.target.value}), NP_SELECT_STYLE),
        fLabel('Button Text:'),
        fInput(s.np_cartButtonText, e=>setState({np_cartButtonText:e.target.value}), { style:{ maxWidth:'1040px' }}),
        fLabel('Heading:'),
        fInput(s.np_cartHeading, e=>setState({np_cartHeading:e.target.value}), { style:{ maxWidth:'1040px' }})
      ),
      // its own group: it filters what the cart offers, not how the button looks
      h('div', { style:{ marginTop:'34px' }}, npSubTitle('Display Rules')),
      fieldGrid(
        ...hideInCartRow(s.np_cartHideInCart, ()=>setState(p=>({ np_cartHideInCart:!p.np_cartHideInCart })))
      )
    ),
    // only rendered while a warranty row is set to show in the floating cart
    showFloating ? divider() : null,
    // The warranty item expands and collapses in the floating cart, and Text is
    // what it reads when collapsed.
    showFloating ? npSection(s, 'floating', 'Floating Cart Settings',
      fieldGrid(
        fLabel('Text:'),
        fInput(s.np_fcText, e=>setState({np_fcText:e.target.value}), { style:{ maxWidth:'1040px' }}),
        ...centerRow('Product Photo:', h('div', { style:{ display:'flex', alignItems:'center', gap:'14px', fontSize:'16px' }},
          toggle(s.np_fcShowPhoto, ()=>setState(p=>({np_fcShowPhoto:!p.np_fcShowPhoto}))), 'Show Product Photo'
        ))
      )
    ) : null
  );
}

// ─── PAGE TAB ─────────────────────────────────────────────────────────────────
const ATTRIBUTE_OPTIONS = ['By Audience','Category Relation','Category Relation (Backoffice Name)','Collection','Discount Percentage','Expedited Production days','Grouped parent SKU','Material','Parent SKUs','Price','Product Type','Production days','ShippingByFactory','Shop For','SKU','Stock Status','Stone'];
const OPERATOR_OPTIONS = ['IsOneOf','IsNoneOf'];

function renderAddConditionsBtn(onClick, label) {
  return h('div', { onClick, style:{ display:'inline-flex', alignItems:'center', gap:'6px', color:'#1976d2', fontSize:'14px', fontWeight:'600', letterSpacing:'.3px', cursor:'pointer' }},
    icon('add',{fontSize:'20px'}), label || 'ADD CONDITIONS'
  );
}
function renderConditionRow(cond, attributeOptions, onAttr, onOperator, onValue, onRemove) {
  return h('div', { style:{ display:'flex', gap:'12px', alignItems:'center', marginBottom:'14px' }},
    fSelect(cond.attribute, attributeOptions, onAttr, {minWidth:'220px'}),
    fSelect(cond.operator, OPERATOR_OPTIONS, onOperator, {minWidth:'150px'}),
    fInput(cond.value, onValue, { placeholder:`Select ${cond.attribute}`, style:{ flex:'1' }}),
    h('div', { class:'tb', onClick:onRemove, style:{ width:'36px', height:'36px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'rgba(0,0,0,0.45)', flexShrink:'0' }}, icon('close',{fontSize:'20px'}))
  );
}

function addCondition(pageName) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: [...(prev.pageConditions[pageName]||[]), { attribute:'Parent SKUs', operator:'IsOneOf', value:'' }] } }));
}
function updateCondition(pageName, i, patch) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: prev.pageConditions[pageName].map((c,j)=> j===i ? {...c, ...patch} : c) } }));
}
function removeCondition(pageName, i) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: prev.pageConditions[pageName].filter((_,j)=>j!==i) } }));
}
function buildPageSection(s, pageName) {
  const conditions = s.pageConditions[pageName] || [];
  return h('div', { style:{ marginBottom:'40px' }},
    h('div', { style:{ fontSize:'18px', fontWeight:'700', marginBottom:'14px' }}, pageName + ':'),
    conditions.length === 0
      ? h('div', {},
          h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }}, `No filters selected. The variant will appear for all ${pageName}s.`),
          renderAddConditionsBtn(()=>addCondition(pageName))
        )
      : h('div', {},
          ...conditions.map((cond,i) => renderConditionRow(cond, ATTRIBUTE_OPTIONS,
            e=>updateCondition(pageName,i,{attribute:e.target.value}),
            e=>updateCondition(pageName,i,{operator:e.target.value}),
            e=>updateCondition(pageName,i,{value:e.target.value}),
            ()=>removeCondition(pageName,i)
          )),
          renderAddConditionsBtn(()=>addCondition(pageName))
        )
  );
}
// Nested items are matched against the parent product, so there is a single list
// of conditions here rather than one section per page.
const NP_PARENT_KEY = 'Parent SKU/s';
function buildParentSkuTab(s) {
  const conditions = s.pageConditions[NP_PARENT_KEY] || [];
  return h('div', { style:{ maxWidth:'1200px' }},
    h('div', { style:{ fontSize:'18px', fontWeight:'700', marginBottom:'14px' }}, 'Parent SKU/s Properties:'),
    conditions.length === 0
      ? h('div', {},
          h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }},
            'No filters selected. The Nested items will appear for ',
            h('strong', { style:{ textDecoration:'underline' }}, 'all products'), '.'
          ),
          renderAddConditionsBtn(()=>addCondition(NP_PARENT_KEY))
        )
      : h('div', {},
          ...conditions.map((cond,i) => renderConditionRow(cond, ATTRIBUTE_OPTIONS,
            e=>updateCondition(NP_PARENT_KEY,i,{attribute:e.target.value}),
            e=>updateCondition(NP_PARENT_KEY,i,{operator:e.target.value}),
            e=>updateCondition(NP_PARENT_KEY,i,{value:e.target.value}),
            ()=>removeCondition(NP_PARENT_KEY,i)
          )),
          renderAddConditionsBtn(()=>addCondition(NP_PARENT_KEY), 'ADD ANOTHER CONDITION')
        )
  );
}
function buildPageTab(s) {
  if (s.componentTitle === NESTED_PRODUCTS) return buildParentSkuTab(s);
  return h('div', { style:{ maxWidth:'1200px' }},
    ...s.activePages.map(pageName => buildPageSection(s, pageName))
  );
}

// ─── TARGETING TAB ────────────────────────────────────────────────────────────
const USER_ATTRIBUTE_OPTIONS = ['Customer Type','Email Domain','Order Count','Total Spent','Loyalty Tier','Location','Signed In Status','Newsletter Subscriber'];
const CART_ATTRIBUTE_OPTIONS = ['Cart Value','Item Count','Contains SKU','Contains Category','Discount Applied','Currency'];
const TARGETING_SECTIONS = [
  { group:'user', icon:'person',         title:'User Properties', noun:'user', attributeOptions:USER_ATTRIBUTE_OPTIONS },
  { group:'cart', icon:'shopping_cart',   title:'Cart Properties', noun:'cart', attributeOptions:CART_ATTRIBUTE_OPTIONS },
];

function toggleTargetingSection(group) {
  setState(prev => ({ targetingOpen: { ...prev.targetingOpen, [group]: !prev.targetingOpen[group] } }));
}
function addTargetingCondition(group, defaultAttr) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: [...prev.targetingConditions[group], { attribute:defaultAttr, operator:'IsOneOf', value:'' }] } }));
}
function updateTargetingCondition(group, i, patch) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: prev.targetingConditions[group].map((c,j)=>j===i?{...c,...patch}:c) } }));
}
function removeTargetingCondition(group, i) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: prev.targetingConditions[group].filter((_,j)=>j!==i) } }));
}

function buildTargetingSection(s, section) {
  const { group, icon:ico, title, noun, attributeOptions } = section;
  const open = s.targetingOpen[group];
  const conditions = s.targetingConditions[group];
  return h('div', {},
    h('div', { onClick:()=>toggleTargetingSection(group), style:{ display:'flex', alignItems:'center', gap:'10px', cursor:'pointer', marginBottom: open?'14px':'0' }},
      icon(open?'expand_more':'chevron_right', {fontSize:'20px', color:'rgba(0,0,0,0.6)'}),
      icon(ico, {fontSize:'20px', color:'rgba(0,0,0,0.6)'}),
      h('div', { style:{ fontSize:'17px', fontWeight:'700' }}, title + ':')
    ),
    open ? (
      conditions.length === 0
        ? h('div', {},
            h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }}, `No ${noun} filters selected. The variant will be shown to all ${noun}s.`),
            renderAddConditionsBtn(()=>addTargetingCondition(group, attributeOptions[0]))
          )
        : h('div', {},
            ...conditions.map((cond,i) => renderConditionRow(cond, attributeOptions,
              e=>updateTargetingCondition(group,i,{attribute:e.target.value}),
              e=>updateTargetingCondition(group,i,{operator:e.target.value}),
              e=>updateTargetingCondition(group,i,{value:e.target.value}),
              ()=>removeTargetingCondition(group,i)
            )),
            renderAddConditionsBtn(()=>addTargetingCondition(group, attributeOptions[0]))
          )
    ) : null
  );
}

function buildTargetingTab(s) {
  return h('div', { style:{ maxWidth:'1200px' }},
    ...TARGETING_SECTIONS.map((section, idx) =>
      h('div', {},
        buildTargetingSection(s, section),
        idx < TARGETING_SECTIONS.length - 1 ? h('div', { style:{ height:'1px', background:'rgba(0,0,0,0.1)', margin:'24px 0 28px' }}) : null
      )
    )
  );
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyHash();
syncHash(false);
window.addEventListener('hashchange', applyHash);
</script>
