      h('div', { class: full ? '' : 'add-btn', onClick: full ? undefined : npAddSection,
        title: full ? `Up to ${NP_MAX_SECTIONS} sections` : '',
        style: full
          ? { display:'inline-flex', alignItems:'center', gap:'6px', padding:'9px 20px', border:'1px solid rgba(0,0,0,0.18)', borderRadius:'6px', color:'rgba(0,0,0,0.35)', fontSize:'14px', fontWeight:'500', letterSpacing:'.4px', cursor:'not-allowed' }
          : {}},
        icon('add',{fontSize:'18px'}), 'ADD SECTION'
      ),
      h('div', { style:{ marginLeft:'auto', fontSize:'14px', color:'rgba(0,0,0,0.6)' }}, `${secs.length} of ${NP_MAX_SECTIONS} items added`)
    )
  );
}

function npRadios(value, options, onPick) {
  return h('div', { style:{ display:'flex', gap:'34px', flexWrap:'wrap' }},
    ...options.map(([key,label]) =>
      h('div', { onClick:()=>onPick(key), style:{ display:'flex', alignItems:'center', gap:'9px', fontSize:'16px', cursor:'pointer' }},
        h('span', { style:ringStyle(value===key) },
          value===key ? h('span',{style:{width:'11px',height:'11px',borderRadius:'50%',background:'#1976d2',display:'block'}}) : null
        ),
        label
      )
    )
  );
}

const NP_PDP_DISPLAY_TYPES = [['carousel','Carousel'], ['stacked','Stacked'], ['grid','Grid']];

const NP_SELECT_STYLE = { width:'100%', maxWidth:'1040px', height:'50px', border:'1px solid rgba(0,0,0,0.23)', borderRadius:'6px', padding:'0 12px', fontSize:'15px', background:'#fff' };

// A sub-title in the same voice as Cart Settings' "Nested Button".
function npSubTitle(text) { return h('div', { style:{ fontSize:'16px', fontWeight:'700' }}, text); }

function buildNestedProductsTemplate(s) {
  const divider = () => h('div', { style:{ height:'1px', background:'rgba(0,0,0,0.12)', margin:'34px 0', maxWidth:'1200px' }});
  const showFloating = npHasFloatingCart(s);
  return h('div', { style:{ maxWidth:'1200px' }},
    npSection(s, 'products', 'Products', npProductsSection(s)),
    divider(),
    // the heading and display type belong to a section, so they are grouped and
    // titled the same way the section cards above are
    npSection(s, 'pdp', 'PDP Settings',
      ...s.np_sections.map((section, si) =>
        h('div', { style:{ marginTop: si ? '34px' : '0' }},
          npSubTitle(npSectionTitle(si)),
          fieldGrid(
            fLabel('Heading:'),
            fInput(section.heading, e=>setNpSection(si,{heading:e.target.value}), { style:{ maxWidth:'1040px' }}),
            ...centerRow('Display Type:', npRadios(section.displayType, NP_PDP_DISPLAY_TYPES, k=>setNpSection(si,{displayType:k})))
          )
        )
      )
    ),
    divider(),
    npSection(s, 'cart', 'Cart Settings',
      npSubTitle('Nested Button'),
      fieldGrid(
        ...centerRow('Show As:', npRadios(s.np_cartShowAs, [['collapsed','Collapsed'],['expanded','Expanded']], k=>setState({np_cartShowAs:k}))),
        fLabel('Icon:'),
        fSelect(s.np_cartIcon, NP_ICONS, e=>setState({np_cartIcon:e.target.value}), NP_SELECT_STYLE),
        fLabel('Button Text:'),
        fInput(s.np_cartButtonText, e=>setState({np_cartButtonText:e.target.value}), { style:{ maxWidth:'1040px' }}),
        fLabel('Heading:'),
        fInput(s.np_cartHeading, e=>setState({np_cartHeading:e.target.value}), { style:{ maxWidth:'1040px' }})
      ),
      // its own group: it filters what the cart offers, not how the button looks
      h('div', { style:{ marginTop:'34px' }}, npSubTitle('Display Rules')),
      fieldGrid(
        ...hideInCartRow(s.np_cartHideInCart, ()=>setState(p=>({ np_cartHideInCart:!p.np_cartHideInCart })))
      )
    ),
    // only rendered while a warranty row is set to show in the floating cart
    showFloating ? divider() : null,
    // The warranty item expands and collapses in the floating cart, and Text is
    // what it reads when collapsed.
    showFloating ? npSection(s, 'floating', 'Floating Cart Settings',
      fieldGrid(
        fLabel('Text:'),
        fInput(s.np_fcText, e=>setState({np_fcText:e.target.value}), { style:{ maxWidth:'1040px' }}),
        ...centerRow('Product Photo:', h('div', { style:{ display:'flex', alignItems:'center', gap:'14px', fontSize:'16px' }},
          toggle(s.np_fcShowPhoto, ()=>setState(p=>({np_fcShowPhoto:!p.np_fcShowPhoto}))), 'Show Product Photo'
        ))
      )
    ) : null
  );
}

// ─── PAGE TAB ─────────────────────────────────────────────────────────────────
const ATTRIBUTE_OPTIONS = ['By Audience','Category Relation','Category Relation (Backoffice Name)','Collection','Discount Percentage','Expedited Production days','Grouped parent SKU','Material','Parent SKUs','Price','Product Type','Production days','ShippingByFactory','Shop For','SKU','Stock Status','Stone'];
const OPERATOR_OPTIONS = ['IsOneOf','IsNoneOf'];

function renderAddConditionsBtn(onClick, label) {
  return h('div', { onClick, style:{ display:'inline-flex', alignItems:'center', gap:'6px', color:'#1976d2', fontSize:'14px', fontWeight:'600', letterSpacing:'.3px', cursor:'pointer' }},
    icon('add',{fontSize:'20px'}), label || 'ADD CONDITIONS'
  );
}
function renderConditionRow(cond, attributeOptions, onAttr, onOperator, onValue, onRemove) {
  return h('div', { style:{ display:'flex', gap:'12px', alignItems:'center', marginBottom:'14px' }},
    fSelect(cond.attribute, attributeOptions, onAttr, {minWidth:'220px'}),
    fSelect(cond.operator, OPERATOR_OPTIONS, onOperator, {minWidth:'150px'}),
    fInput(cond.value, onValue, { placeholder:`Select ${cond.attribute}`, style:{ flex:'1' }}),
    h('div', { class:'tb', onClick:onRemove, style:{ width:'36px', height:'36px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'rgba(0,0,0,0.45)', flexShrink:'0' }}, icon('close',{fontSize:'20px'}))
  );
}

function addCondition(pageName) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: [...(prev.pageConditions[pageName]||[]), { attribute:'Parent SKUs', operator:'IsOneOf', value:'' }] } }));
}
function updateCondition(pageName, i, patch) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: prev.pageConditions[pageName].map((c,j)=> j===i ? {...c, ...patch} : c) } }));
}
function removeCondition(pageName, i) {
  setState(prev => ({ pageConditions: { ...prev.pageConditions, [pageName]: prev.pageConditions[pageName].filter((_,j)=>j!==i) } }));
}
function buildPageSection(s, pageName) {
  const conditions = s.pageConditions[pageName] || [];
  return h('div', { style:{ marginBottom:'40px' }},
    h('div', { style:{ fontSize:'18px', fontWeight:'700', marginBottom:'14px' }}, pageName + ':'),
    conditions.length === 0
      ? h('div', {},
          h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }}, `No filters selected. The variant will appear for all ${pageName}s.`),
          renderAddConditionsBtn(()=>addCondition(pageName))
        )
      : h('div', {},
          ...conditions.map((cond,i) => renderConditionRow(cond, ATTRIBUTE_OPTIONS,
            e=>updateCondition(pageName,i,{attribute:e.target.value}),
            e=>updateCondition(pageName,i,{operator:e.target.value}),
            e=>updateCondition(pageName,i,{value:e.target.value}),
            ()=>removeCondition(pageName,i)
          )),
          renderAddConditionsBtn(()=>addCondition(pageName))
        )
  );
}
// Nested items are matched against the parent product, so there is a single list
// of conditions here rather than one section per page.
const NP_PARENT_KEY = 'Parent SKU/s';
function buildParentSkuTab(s) {
  const conditions = s.pageConditions[NP_PARENT_KEY] || [];
  return h('div', { style:{ maxWidth:'1200px' }},
    h('div', { style:{ fontSize:'18px', fontWeight:'700', marginBottom:'14px' }}, 'Parent SKU/s Properties:'),
    conditions.length === 0
      ? h('div', {},
          h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }},
            'No filters selected. The Nested items will appear for ',
            h('strong', { style:{ textDecoration:'underline' }}, 'all products'), '.'
          ),
          renderAddConditionsBtn(()=>addCondition(NP_PARENT_KEY))
        )
      : h('div', {},
          ...conditions.map((cond,i) => renderConditionRow(cond, ATTRIBUTE_OPTIONS,
            e=>updateCondition(NP_PARENT_KEY,i,{attribute:e.target.value}),
            e=>updateCondition(NP_PARENT_KEY,i,{operator:e.target.value}),
            e=>updateCondition(NP_PARENT_KEY,i,{value:e.target.value}),
            ()=>removeCondition(NP_PARENT_KEY,i)
          )),
          renderAddConditionsBtn(()=>addCondition(NP_PARENT_KEY), 'ADD ANOTHER CONDITION')
        )
  );
}
function buildPageTab(s) {
  if (s.componentTitle === NESTED_PRODUCTS) return buildParentSkuTab(s);
  return h('div', { style:{ maxWidth:'1200px' }},
    ...s.activePages.map(pageName => buildPageSection(s, pageName))
  );
}

// ─── TARGETING TAB ────────────────────────────────────────────────────────────
const USER_ATTRIBUTE_OPTIONS = ['Customer Type','Email Domain','Order Count','Total Spent','Loyalty Tier','Location','Signed In Status','Newsletter Subscriber'];
const CART_ATTRIBUTE_OPTIONS = ['Cart Value','Item Count','Contains SKU','Contains Category','Discount Applied','Currency'];
const TARGETING_SECTIONS = [
  { group:'user', icon:'person',         title:'User Properties', noun:'user', attributeOptions:USER_ATTRIBUTE_OPTIONS },
  { group:'cart', icon:'shopping_cart',   title:'Cart Properties', noun:'cart', attributeOptions:CART_ATTRIBUTE_OPTIONS },
];

function toggleTargetingSection(group) {
  setState(prev => ({ targetingOpen: { ...prev.targetingOpen, [group]: !prev.targetingOpen[group] } }));
}
function addTargetingCondition(group, defaultAttr) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: [...prev.targetingConditions[group], { attribute:defaultAttr, operator:'IsOneOf', value:'' }] } }));
}
function updateTargetingCondition(group, i, patch) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: prev.targetingConditions[group].map((c,j)=>j===i?{...c,...patch}:c) } }));
}
function removeTargetingCondition(group, i) {
  setState(prev => ({ targetingConditions: { ...prev.targetingConditions, [group]: prev.targetingConditions[group].filter((_,j)=>j!==i) } }));
}

function buildTargetingSection(s, section) {
  const { group, icon:ico, title, noun, attributeOptions } = section;
  const open = s.targetingOpen[group];
  const conditions = s.targetingConditions[group];
  return h('div', {},
    h('div', { onClick:()=>toggleTargetingSection(group), style:{ display:'flex', alignItems:'center', gap:'10px', cursor:'pointer', marginBottom: open?'14px':'0' }},
      icon(open?'expand_more':'chevron_right', {fontSize:'20px', color:'rgba(0,0,0,0.6)'}),
      icon(ico, {fontSize:'20px', color:'rgba(0,0,0,0.6)'}),
      h('div', { style:{ fontSize:'17px', fontWeight:'700' }}, title + ':')
    ),
    open ? (
      conditions.length === 0
        ? h('div', {},
            h('div', { style:{ fontSize:'15px', color:'rgba(0,0,0,0.6)', marginBottom:'16px' }}, `No ${noun} filters selected. The variant will be shown to all ${noun}s.`),
            renderAddConditionsBtn(()=>addTargetingCondition(group, attributeOptions[0]))
          )
        : h('div', {},
            ...conditions.map((cond,i) => renderConditionRow(cond, attributeOptions,
              e=>updateTargetingCondition(group,i,{attribute:e.target.value}),
              e=>updateTargetingCondition(group,i,{operator:e.target.value}),
              e=>updateTargetingCondition(group,i,{value:e.target.value}),
              ()=>removeTargetingCondition(group,i)
            )),
            renderAddConditionsBtn(()=>addTargetingCondition(group, attributeOptions[0]))
          )
    ) : null
  );
}

function buildTargetingTab(s) {
  return h('div', { style:{ maxWidth:'1200px' }},
    ...TARGETING_SECTIONS.map((section, idx) =>
      h('div', {},
        buildTargetingSection(s, section),
        idx < TARGETING_SECTIONS.length - 1 ? h('div', { style:{ height:'1px', background:'rgba(0,0,0,0.1)', margin:'24px 0 28px' }}) : null
      )
    )
  );
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyHash();
syncHash(false);
window.addEventListener('hashchange', applyHash);
</script>
</body>
</html>
